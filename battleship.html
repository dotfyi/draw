<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><script>(function(){try{var t=localStorage.getItem("dm_theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);var k=localStorage.getItem("dm_skin_eff");if(k&&k!=="none")document.documentElement.setAttribute("data-skin",k)}catch(e){}})()</script><meta name="theme-color" content="#fff"><title>морський бій · draw & more</title>
<style>
:root{--bg:#fff;--fg:#1b1b1a;--muted:#92918d;--line:#e7e7e4;--bad:#e34b4b;--soft:#f4f4f1;--inv-bg:#111;--inv-fg:#fff;--board:#e9e9e6;--cell:#fff;--ship:#d4d4cf;--blk:#f5f5f2;--prev:#c9d8d3;--hit:#f7dada;--hitfg:#d43f3f;--sunk:#e8baba;--sunkfg:#a92626;--dot:#9a9993;--hit2:#efbaba;--sunk2:#d88f8f;--serif:"Iowan Old Style","Palatino Linotype",Georgia,serif}
:root[data-theme="dark"]{--bg:#161616;--fg:#ebebea;--muted:#8a8a87;--line:#2e2e2e;--soft:#272727;--inv-bg:#ebebea;--inv-fg:#161616;--board:#2b2b2b;--cell:#1f1f1f;--ship:#55554f;--blk:#191919;--prev:#33504a;--hit:#4a2424;--hitfg:#ff8080;--sunk:#6b2c2c;--sunkfg:#ffa0a0;--dot:#80807a;--hit2:#5a2a2a;--sunk2:#7a3636}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--fg:#ebebea;--muted:#8a8a87;--line:#2e2e2e;--soft:#272727;--inv-bg:#ebebea;--inv-fg:#161616;--board:#2b2b2b;--cell:#1f1f1f;--ship:#55554f;--blk:#191919;--prev:#33504a;--hit:#4a2424;--hitfg:#ff8080;--sunk:#6b2c2c;--sunkfg:#ffa0a0;--dot:#80807a;--hit2:#5a2a2a;--sunk2:#7a3636}}
html{touch-action:manipulation}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{touch-action:manipulation}
body{height:100dvh;color:var(--fg);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 8px);user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{width:100%;max-width:480px;height:100%;min-height:0;display:flex;flex-direction:column;gap:7px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:28px}
.link{color:var(--muted);font-size:14px;padding:5px}
.status{font-size:12px;color:var(--muted);text-align:right}
.heading{font:600 24px var(--serif);text-align:center}
.sub{font-size:12px;color:var(--muted);text-align:center;line-height:1.35}
.stats{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.board-wrap{width:100%;display:flex;justify-content:center;align-items:center;flex:1;min-height:0}

/* головне поле */
.board{width:min(100%,calc(100dvh - 260px));max-width:430px;aspect-ratio:1;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));gap:2px;background:var(--board);padding:2px;border-radius:12px;touch-action:manipulation}
.cell{background:var(--cell);border-radius:3px;display:grid;place-items:center;min-width:0;min-height:0;overflow:hidden;font-size:clamp(10px,3.3vw,17px);font-weight:650;position:relative}
.cell.ship{background:var(--ship)}
.cell.blocked{background:var(--blk)}
.cell.preview{background:var(--prev)}
.cell.miss::after{content:"";width:15%;height:15%;min-width:3px;min-height:3px;border-radius:50%;background:var(--dot)}
.cell.hit{background:var(--hit);color:var(--hitfg)}
.cell.sunk{background:var(--sunk);color:var(--sunkfg)}
.cell:disabled{cursor:default}

.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.pill{border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:12px;color:var(--muted)}
.pill.on{border-color:var(--fg);color:var(--fg);font-weight:650}
.pill:disabled{opacity:.28}
.primary{background:var(--inv-bg);color:var(--inv-fg);border-radius:999px;padding:11px 22px;font-size:14px}
.primary:disabled{opacity:.3}
.actions{display:flex;justify-content:center;gap:8px;align-items:center}
.hint{font-size:11px;color:var(--muted);text-align:center;min-height:25px;line-height:1.35}

/* низ: реакції зліва, мініполе справа */
.bottom{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:88px;padding:2px 2px 0}
.reactions{flex:1 1 auto;max-width:184px;margin:16px auto 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 6px;justify-items:center;align-content:center}
.reaction{border:1px solid var(--line);border-radius:50%;width:100%;max-width:42px;aspect-ratio:1;font-size:20px;line-height:1;display:grid;place-items:center}
.reaction:active{transform:scale(.88)}
.reaction.sent{animation:tap .5s ease-out}
@keyframes tap{0%{transform:scale(1)}35%{transform:scale(1.3);background:var(--soft);border-color:var(--fg)}100%{transform:scale(1)}}
.fly{position:fixed;z-index:9;font-size:26px;pointer-events:none;transform:translate(-50%,0);animation:flyup .9s ease-out forwards}
@keyframes flyup{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-90px) scale(1.15)}}
.mini-wrap{width:104px;flex:0 0 104px}
.mini-label{font-size:10px;color:var(--muted);text-align:center;margin-bottom:4px}

/* мініполе: жодного тексту в клітинках, тому сітка не зсувається */
.mini-board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));gap:1px;background:var(--board);padding:2px;border-radius:7px}
.mini-cell{background:var(--cell);border-radius:1px;position:relative;display:grid;place-items:center;min-width:0;min-height:0;overflow:hidden;font-size:0;line-height:0}
.mini-cell.ship{background:var(--ship)}
.mini-cell.miss::after{content:"";width:20%;height:20%;border-radius:50%;background:var(--dot)}
.mini-cell.hit{background:var(--hit2)}
.mini-cell.hit::after{content:"";width:38%;height:38%;border-radius:50%;background:#c23a3a}
.mini-cell.sunk{background:var(--sunk2)}
.mini-cell.sunk::after{content:"";width:38%;height:38%;border-radius:50%;background:#861515}

/* кінець гри */
.overlay{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:24px;text-align:center;z-index:4;overflow-y:auto}
.overlay.show{display:flex}
.overlay strong{font:600 32px var(--serif)}
.ov-actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px;align-items:stretch}
.ov-actions .pill{padding:13px 12px;font-size:14px}
.stat-grid{width:100%;max-width:340px;display:grid;grid-template-columns:1fr 72px 72px;gap:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:center}
.stat-grid>div{padding:11px 8px;font-size:15px;border-top:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.stat-grid>div.h{border-top:0;font-size:12px;padding:9px 8px;background:var(--blk)}
.stat-grid>div.l{text-align:left;padding-left:16px}
.stat-grid>div.best{color:var(--fg);font-weight:700}

.float-reaction{position:fixed;z-index:9;left:50%;top:45%;font-size:76px;pointer-events:none;animation:pop 1.6s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,20px) scale(.4)}25%{opacity:1;transform:translate(-50%,-10px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-150px) scale(.8)}}

@media(max-height:690px){.app{gap:4px}.heading{font-size:21px}.board{width:min(100%,calc(100dvh - 225px))}.bottom{min-height:72px}.mini-wrap{width:88px;flex-basis:88px}.reaction{max-width:36px;font-size:18px}.reactions{gap:6px 5px}.pill{padding:7px 10px}}
@media(max-width:360px){.mini-wrap{width:78px;flex-basis:78px}.reaction{max-width:32px;font-size:16px}.reactions{gap:5px 4px}}
/* ── оформлення до свят ── */
:root[data-skin="halloween"]{--bg:#150f1f;--fg:#f3ead9;--muted:#9a8aa8;--line:#33284a;--pill:#1e1630;--soft:#261c3b;--inv-bg:#ff8a1f;--inv-fg:#1a1024;--ok:#47c98b;--bad:#ff5d73;--sh:rgba(0,0,0,.5);--okbg:#173a31;--board:#2a1f40;--cell:#1e1630;--ship:#5b4b78;--blk:#1a1228;--prev:#3d5a4f;--hit:#4a2230;--hitfg:#ff7d6b;--sunk:#6e2a3a;--sunkfg:#ffa08f;--dot:#8a7aa3;--hit2:#5a2a36;--sunk2:#7e3646}
:root[data-skin="winter"]{--bg:#eef5ff;--fg:#1c2b45;--muted:#6f84a6;--line:#d3e1f5;--pill:#fff;--soft:#e3eefc;--inv-bg:#2563c9;--inv-fg:#fff;--sh:rgba(40,80,140,.12);--okbg:#dcf3ea;--board:#cfe0f6;--cell:#fff;--ship:#9db7da;--blk:#e8f0fb;--prev:#bfe3da;--hit:#fadcdc;--hitfg:#d43f3f;--sunk:#f0b9b9;--sunkfg:#a92626;--dot:#7d92b3;--hit2:#f0baba;--sunk2:#dd9090}
</style></head><body><main class="app">
<header class="top"><button class="link" id="back">‹ меню</button><div class="status" id="room">кімната</div></header>
<h1 class="heading" id="title">розстав кораблі</h1><div class="sub" id="subtitle">Обери корабель і постав його на поле</div>
<div class="stats" id="stats"><span id="fleet">Флот: 10 кораблів</span><span id="turn"></span></div>
<div class="board-wrap"><div class="board" id="board"></div></div>
<div class="controls" id="ships"></div><div class="actions" id="actions"></div><div class="hint" id="hint">Кораблі не можуть торкатися навіть по діагоналі.</div>
<div class="bottom" id="bottom" style="display:none"><div class="reactions" id="reactions"></div><div class="mini-wrap"><div class="mini-label">мій флот</div><div class="mini-board" id="miniBoard"></div></div></div>
</main>
<div class="overlay" id="overlay"><strong id="ovTitle"></strong><div class="sub" id="ovText"></div><div class="stat-grid" id="ovStats"></div><div class="ov-actions"><button class="primary" id="rematch">зіграти ще раз</button><button class="pill" id="again">до меню</button></div></div>
<script>
const FB="https://draw-8cb08-default-rtdb.europe-west1.firebasedatabase.app",ROOM="k7Qm2xVp9Lr4Tz8n";
const vib=p=>{try{if(localStorage.getItem("dm_vib")==="0")return}catch(e){}navigator.vibrate&&navigator.vibrate(p)};
const $=id=>document.getElementById(id),room=localStorage.getItem("dm_room"),user=JSON.parse(localStorage.getItem("dm_user")||"null");
if(!room||!user)location.href="index.html";
const base=`${FB}/rooms/${ROOM}/dm/${room}`,other=s=>s==="v"?"a":"v";
let slot=null,db={},es=null,phase="place",fleet=[],selected=4,vertical=false,seenReaction=0,curGid,loggedGid=null;
const lengths=[4,3,3,2,2,2,1,1,1,1];
// верхній ряд — 4 старі, нижній — 4 нові
const reactionSet=["❤️","😮","😂","😡","👏","😭","🔥","🎯"];
const read=async path=>(await fetch(`${base}/${path}.json`)).json();
const write=(path,val)=>fetch(`${base}/${path}.json`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(val)});
function apply(msg){let p=(msg.path||"/").split("/").filter(Boolean),o=db;for(let i=0;i<p.length-1;i++)o=o[p[i]]=o[p[i]]||{};let k=p[p.length-1];if(!p.length)db=msg.data||{};else if(msg.data===null)delete o[k];else o[k]=msg.data;}
function cellsFor(start,len,vert){let r=Math.floor(start/10),c=start%10,out=[];for(let n=0;n<len;n++){let rr=r+(vert?n:0),cc=c+(vert?0:n);if(rr>9||cc>9)return null;out.push(rr*10+cc)}return out}
function neighbours(i){let r=Math.floor(i/10),c=i%10,a=[];for(let y=-1;y<=1;y++)for(let x=-1;x<=1;x++){let rr=r+y,cc=c+x;if(rr>=0&&rr<10&&cc>=0&&cc<10)a.push(rr*10+cc)}return a}
function occupied(){return new Set(fleet.flatMap(s=>s.cells))}
function blocked(){let out=new Set();for(const sh of fleet)for(const i of sh.cells)for(const n of neighbours(i))out.add(n);return out}
function canPlace(cells){if(!cells)return false;let forbidden=blocked();return cells.every(i=>!forbidden.has(i))}
function placeAt(i){if(phase!=="place")return;let max=lengths.filter(x=>x===selected).length,done=fleet.filter(s=>s.len===selected).length;if(done>=max)return;let cs=cellsFor(i,selected,vertical);if(!canPlace(cs)){$("hint").textContent="Тут замало місця або корабель торкається іншого. Спробуй іншу клітинку.";return}fleet.push({len:selected,cells:cs});let next=[4,3,2,1].find(l=>fleet.filter(s=>s.len===l).length<lengths.filter(x=>x===l).length);if(next!==undefined)selected=next;render()}

function renderBoard(){
  const b=$("board");b.innerHTML="";
  let occ=occupied(),block=blocked();
  for(let i=0;i<100;i++){
    let el=document.createElement("button");el.type="button";el.className="cell";
    if(phase==="place"){
      if(occ.has(i))el.classList.add("ship");else if(block.has(i))el.classList.add("blocked");
      el.onclick=()=>placeAt(i)
    }else{
      let a=db.battle?.shots?.[slot]||{},s=a[i];
      if(s){
        el.classList.add(s.type);
        if(s.auto)el.classList.add("auto");
        if(s.type==="hit")el.textContent="●";
        if(s.type==="sunk")el.textContent="×";
        el.disabled=true
      }else if(db.battle?.turn===slot&&!db.battle?.finished){el.onclick=()=>fire(i)}
      else el.disabled=true
    }
    b.append(el)
  }
}

function renderMini(){
  let m=$("miniBoard");m.innerHTML="";
  let myShips=own().ships||[],shipCells=new Set(myShips.flatMap(s=>s.cells)),incoming=db.battle?.shots?.[other(slot)]||{};
  for(let i=0;i<100;i++){
    let el=document.createElement("div");el.className="mini-cell";
    if(shipCells.has(i))el.classList.add("ship");
    let s=incoming[i];
    if(s){el.classList.remove("ship");el.classList.add(s.type);if(s.auto)el.classList.add("auto")}
    m.append(el)
  }
}

function buildReactions(){
  const box=$("reactions");
  if(box.children.length===reactionSet.length)return;
  box.innerHTML="";
  reactionSet.forEach(emoji=>{let btn=document.createElement("button");btn.className="reaction";btn.textContent=emoji;btn.title="Надіслати реакцію";btn.onclick=()=>{sendReaction(emoji);tapFeedback(btn,emoji)};box.append(btn)})
}

function render(){
  renderBoard();$("ships").innerHTML="";$("actions").innerHTML="";
  if(phase==="place"){
    [4,3,2,1].forEach(len=>{let total=lengths.filter(x=>x===len).length,done=fleet.filter(x=>x.len===len).length,btn=document.createElement("button");btn.className="pill"+(selected===len?" on":"");btn.textContent=`${len} палуб · ${done}/${total}`;btn.disabled=done>=total;btn.onclick=()=>{selected=len;render()};$("ships").append(btn)});
    let rot=document.createElement("button");rot.className="pill on";rot.textContent=vertical?"↕ вертикально":"↔ горизонтально";rot.onclick=()=>{vertical=!vertical;render()};$("actions").append(rot);
    let ready=document.createElement("button");ready.className="primary";ready.textContent="готово";ready.disabled=fleet.length!==10;ready.onclick=submitFleet;$("actions").append(ready);
    $("title").textContent="розстав кораблі";$("subtitle").textContent="Вибери довжину внизу, орієнтацію та торкнись поля";$("fleet").textContent=`Розміщено: ${fleet.length}/10`;$("turn").textContent="";$("hint").textContent="Кораблі не можуть торкатися один одного, навіть по діагоналі.";$("bottom").style.display="none";
  }else{
    let btl=db.battle,readyCount=Object.values(btl.players||{}).filter(p=>p.ready).length;
    $("bottom").style.display="flex";buildReactions();
    $("title").textContent=btl.finished?(btl.winner===slot?"ти переміг(ла)!":"цього разу суперник переміг"):"морський бій";
    $("subtitle").textContent=btl.finished?"Гру завершено":readyCount<2?"Очікуємо готовність обох гравців":btl.turn===slot?"Твій хід — обери клітинку":"Хід суперника";
    $("fleet").textContent=`Потоплено: ${sunkCount()}/10`;$("turn").textContent=btl.turn===slot?"твій хід":"хід суперника";
    $("hint").textContent=btl.finished?"Дякуємо за гру":btl.turn===slot?"Влучив — стріляй ще раз. Промахнувся — хід суперника.":"Твої кораблі та влучання суперника видно на мініполі.";
    renderMini();
  }
}

function sunkCount(){let ships=opp().ships||[],a=db.battle?.shots?.[slot]||{};return ships.filter(sh=>sh.cells.every(i=>a[i]?.hit)).length}
function own(){return db.battle?.players?.[slot]||{}}
function opp(){return db.battle?.players?.[other(slot)]||{}}

async function submitFleet(){let payload={ships:fleet,ready:true};await write(`battle/players/${slot}`,payload);phase="wait";refresh()}

async function fire(i){
  let b=db.battle;if(b.turn!==slot||b.finished)return;
  let prior=b.shots?.[slot]||{};if(prior[i])return;
  let ships=opp().ships||[],result={...prior},ship=ships.find(s=>s.cells.includes(i)),now=Date.now();
  result[i]={hit:!!ship,type:ship?"hit":"miss",t:now};
  let sunkShip=ship&&ship.cells.every(x=>result[x]?.hit);
  if(sunkShip){
    for(const x of ship.cells)result[x]={hit:true,type:"sunk",t:(result[x]&&result[x].t)||now};
    for(const x of ship.cells)for(const n of neighbours(x)){if(!result[n]&&!ship.cells.includes(n))result[n]={hit:false,type:"miss",auto:true}}
  }
  await write(`battle/shots/${slot}`,result);
  let allSunk=ships.length>0&&ships.every(sh=>sh.cells.every(x=>result[x]?.hit));
  if(allSunk){await write("battle/finished",true);await write("battle/winner",slot)}
  else if(!ship){await write("battle/turn",other(slot))}
  else{await write("battle/turn",slot)}
}

function tapFeedback(btn,emoji){
  vib(14);
  btn.classList.remove("sent");void btn.offsetWidth;btn.classList.add("sent");
  const r=btn.getBoundingClientRect(),f=document.createElement("div");
  f.className="fly";f.textContent=emoji;f.style.left=(r.left+r.width/2)+"px";f.style.top=(r.top-6)+"px";
  document.body.append(f);setTimeout(()=>f.remove(),950);
}
async function sendReaction(emoji){await write(`battle/reactions/${slot}/${Date.now()}`,emoji)}
function showReaction(emoji){let el=document.createElement("div");el.className="float-reaction";el.textContent=emoji;document.body.append(el);setTimeout(()=>el.remove(),1700)}

/* ───── статистика після гри ───── */
function sideStats(s){
  const shots=db.battle?.shots?.[s]||{},targets=db.battle?.players?.[other(s)]?.ships||[];
  const real=Object.entries(shots).filter(([,x])=>x&&!x.auto);
  const hits=real.filter(([,x])=>x.hit).length;
  const sunk=targets.filter(sh=>sh.cells.every(i=>shots[i]?.hit)).length;
  const timed=real.filter(([,x])=>x.t).sort((a,b)=>a[1].t-b[1].t);
  let streak=null;
  if(timed.length){streak=0;let cur=0;for(const [,x] of timed){if(x.hit){cur++;if(cur>streak)streak=cur}else cur=0}}
  return{shots:real.length,hits,acc:real.length?Math.round(hits/real.length*100):0,sunk,streak,times:timed.map(([,x])=>x.t)};
}
function fmtTime(ms){let s=Math.round(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function logGame(b){
  const id="ships_"+(b.gid||"0");if(loggedGid===id)return;loggedGid=id;
  const a=sideStats("v"),c=sideStats("a"),times=a.times.concat(c.times);
  fetch(`${base}/stats/log/${id}.json`,{method:"PUT",keepalive:true,body:JSON.stringify({g:"ships",w:b.winner||"",sh:{v:[a.shots,a.hits],a:[c.shots,c.hits]},t:times.length?Math.max(...times):Date.now()})}).catch(()=>{});
}
function renderStats(){
  const a=sideStats(slot),b=sideStats(other(slot)),g=$("ovStats");
  const rows=[
    ["пострілів",a.shots,b.shots,0],
    ["влучань",a.hits,b.hits,1],
    ["точність",a.acc+"%",b.acc+"%",1,a.acc,b.acc],
    ["потоплено",a.sunk+"/10",b.sunk+"/10",1,a.sunk,b.sunk],
    ["серія влучань",a.streak===null?"—":a.streak,b.streak===null?"—":b.streak,1,a.streak,b.streak]
  ];
  g.innerHTML="";
  const add=(txt,cls)=>{const d=document.createElement("div");d.className=cls||"";d.textContent=txt;g.append(d);return d};
  add("","h");add("ти","h");add("суперник","h");
  rows.forEach(([name,x,y,cmp,nx,ny])=>{
    add(name,"l");
    const vx=nx!==undefined?nx:x,vy=ny!==undefined?ny:y;
    const ok=cmp&&vx!==null&&vy!==null;
    add(x,ok&&vx>vy?"best":"");add(y,ok&&vy>vx?"best":"");
  });
  const all=a.times.concat(b.times);
  return all.length>1?"тривалість "+fmtTime(Math.max(...all)-Math.min(...all)):"";
}

async function rematch(){
  const b=db.battle;if(!b||!b.finished)return;const loser=b.winner?other(b.winner):"v";
  await write("battle",{gid:Date.now(),players:{},shots:{},turn:loser,started:false});
}
async function init(){
  let root=await read("");
  if(!root||!root.players){alert("Не знайшов кімнату. Повернись у меню та створи гру.");location.href="index.html";return}
  for(const s of ["v","a"])if(root.players[s]?.uid===user.uid)slot=s;
  if(!slot){alert("Цей профіль не є гравцем кімнати.");location.href="index.html";return}
  db=root;
  if(!db.battle){const nb={gid:Date.now(),players:{},shots:{},turn:"v",started:false};await write("battle",nb);db.battle=nb}
  curGid=db.battle.gid;
  fleet=db.battle?.players?.[slot]?.ships||[];
  if(db.battle?.players?.[slot]?.ready)phase="wait";
  let old=db.battle?.reactions?.[other(slot)]||{};
  seenReaction=Math.max(0,...Object.keys(old).map(Number));
  es=new EventSource(base+".json");
  ["put","patch"].forEach(t=>es.addEventListener(t,e=>{try{
    let before=seenReaction;apply(JSON.parse(e.data));
    let r=db.battle?.reactions?.[other(slot)]||{},keys=Object.keys(r).map(Number),latest=Math.max(0,...keys);
    if(latest>before){seenReaction=latest;showReaction(r[latest])}
    refresh()
  }catch(_){}}));
  $("room").textContent="🔑 "+room;refresh()
}

function refresh(){
  if(!db.battle)return;
  let b=db.battle;
  if(b.gid!==curGid){curGid=b.gid;fleet=[];selected=4;vertical=false;$("overlay").classList.remove("show")}
  let me=b.players?.[slot],op=b.players?.[other(slot)];
  if(me?.ready&&op?.ready)phase="match";else if(me?.ready)phase="wait";else phase="place";
  if(phase==="place"){fleet=me?.ships||fleet;render()}
  else if(phase==="wait"){$("title").textContent="чекаємо суперника";$("subtitle").textContent="Твій флот готовий. Гра почнеться, щойно суперник завершить розстановку.";$("board").innerHTML="";$("ships").innerHTML="";$("actions").innerHTML="";$("bottom").style.display="none";$("fleet").textContent="готово ✓";$("turn").textContent=""}
  else render();
  if(b.finished){
    $("ovTitle").textContent=b.winner===slot?"перемога!":"суперник переміг";
    $("ovText").textContent=renderStats()||"Дякуємо за гру";
    $("overlay").classList.add("show");
    logGame(b)
  }else $("overlay").classList.remove("show");
}

$("back").onclick=()=>{if(es)es.close();location.href="index.html"};
$("again").onclick=()=>location.href="index.html";
$("rematch").onclick=rematch;
init();
</script></body></html>
