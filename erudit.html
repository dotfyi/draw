<title>ерудит · draw &amp; more</title>
<style>
:root{--bg:#fbfbfa;--fg:#37352f;--muted:#9b9a97;--line:#e4e4e1;--pill:#fff;--soft:#f1f1ee;--inv-bg:#37352f;--inv-fg:#fff;--ok:#0f7b6c;--bad:#e03e3e;--sh:rgba(30,30,20,.1);--acc:#6c7cff;
--bd:#e6e3db;--cell:#fcfbf7;--tw:#ef5f66;--dw:#5b9cf6;--tl:#f2b53a;--dl:#43c08a;--serif:"Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif}
:root[data-theme="dark"]{--bg:#161616;--fg:#ebebea;--muted:#8a8a87;--line:#2e2e2e;--pill:#202020;--soft:#272727;--inv-bg:#ebebea;--inv-fg:#161616;--sh:rgba(0,0,0,.5);--bd:#2a2a2a;--cell:#1d1d1d}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--fg:#ebebea;--muted:#8a8a87;--line:#2e2e2e;--pill:#202020;--soft:#272727;--inv-bg:#ebebea;--inv-fg:#161616;--sh:rgba(0,0,0,.5);--bd:#2a2a2a;--cell:#1d1d1d}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation}
html,body{height:100%;overflow:hidden}
body{height:100dvh;background:var(--bg);color:var(--fg);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
#app{height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:7px;padding:calc(env(safe-area-inset-top,0px) + 6px) 8px calc(env(safe-area-inset-bottom,0px) + 8px)}
#top{display:flex;align-items:center;justify-content:space-between;min-height:28px;padding:0 4px}
#back{color:var(--muted);font-size:14px;padding:6px 8px 6px 0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--pill);border:1px solid var(--line);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
#zoom.on{background:var(--inv-bg);color:var(--inv-fg)}

/* гравці */
#pls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pl{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:20px;background:var(--pill);border:1.5px solid var(--line);box-shadow:0 6px 16px var(--sh);transition:border-color .3s,box-shadow .3s,transform .3s;min-width:0}
.pl .av{font-size:26px;line-height:1}
.pl .tx{flex:1;min-width:0}
.pl .nm{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .st{font-size:11px;color:var(--muted);height:14px}
.pl .sc{font:700 28px var(--serif);font-variant-numeric:tabular-nums;line-height:1}
.pl.act{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 20%,transparent),0 8px 22px var(--sh);transform:translateY(-1px)}
.pl.act .st{color:var(--acc);font-weight:700}
.pl.act .av{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px) rotate(-6deg)}}
.pl .sc.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.35);color:var(--acc)}}

#info{min-height:26px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:0 4px}
#info b{color:var(--fg)}
.wchip{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--fg)}
.wchip i{font-style:normal;font-size:11px}
.wchip.ok i{color:var(--ok)}.wchip.no i{color:var(--bad)}
.flag{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;border:1px solid var(--bad);color:var(--bad);font-size:12px;font-weight:700;background:color-mix(in srgb,var(--bad) 8%,transparent)}

/* дошка */
#bwrap{flex:1;min-height:0;overflow:auto;border-radius:20px;background:var(--bd);display:flex;box-shadow:inset 0 2px 10px var(--sh);-webkit-overflow-scrolling:touch;scrollbar-width:none}
#bwrap::-webkit-scrollbar{display:none}
#board{display:grid;grid-template-columns:repeat(15,var(--cs));grid-auto-rows:var(--cs);gap:2px;padding:6px;margin:auto;flex:none;transition:all .25s}
.cell{position:relative;border-radius:calc(var(--cs)*.2);background:var(--cell);display:grid;place-items:center;font-weight:800;color:transparent}
.cell.tw{background:color-mix(in srgb,var(--tw) 30%,var(--cell));--p:var(--tw)}
.cell.dw{background:color-mix(in srgb,var(--dw) 30%,var(--cell));--p:var(--dw)}
.cell.tl{background:color-mix(in srgb,var(--tl) 36%,var(--cell));--p:var(--tl)}
.cell.dl{background:color-mix(in srgb,var(--dl) 30%,var(--cell));--p:var(--dl)}
.cell[data-l]::before{content:attr(data-l);font-size:calc(var(--cs)*.3);letter-spacing:-.3px;color:color-mix(in srgb,var(--p) 85%,var(--fg) 15%);font-weight:800;opacity:.95}
.cell.star::before{content:"★";font-size:calc(var(--cs)*.6);color:var(--dw)}
.cell.hov{box-shadow:0 0 0 2px var(--acc),0 0 14px color-mix(in srgb,var(--acc) 60%,transparent);z-index:2}
.cell.have::before{content:none}

.tile{position:absolute;inset:1px;border-radius:calc(var(--cs)*.22);display:grid;place-items:center;background:linear-gradient(145deg,#fffaf0,#efe3c8);color:#3a2f1c;box-shadow:0 2px 0 #d6c5a0,0 3px 6px rgba(60,40,10,.28);font:800 calc(var(--cs)*.62)/1 var(--serif);z-index:1}
.tile s{position:absolute;right:calc(var(--cs)*.09);bottom:calc(var(--cs)*.03);font:700 calc(var(--cs)*.27)/1 ui-sans-serif,-apple-system,sans-serif;text-decoration:none;opacity:.7}
.tile.bl{color:var(--acc)}
.tile.pend{background:linear-gradient(145deg,#fffdf6,#f6ecd2);box-shadow:0 0 0 2px var(--acc),0 6px 12px rgba(60,40,10,.35);transform:translateY(-1px);touch-action:none;z-index:3;animation:place .28s cubic-bezier(.2,.9,.3,1.4)}
@keyframes place{0%{transform:scale(1.5) translateY(-10px);opacity:.4}100%{transform:none;opacity:1}}
.tile.new{animation:drop .5s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(var(--i)*.09s)}
@keyframes drop{0%{transform:translateY(-34px) scale(1.5) rotate(-8deg);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
.tile.glow{box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 70%,transparent),0 2px 0 #d6c5a0,0 0 16px color-mix(in srgb,var(--acc) 55%,transparent)}
.tile.ghosted{opacity:.35}

/* підставка */
#dock{display:flex;flex-direction:column;gap:8px}
#chips{min-height:26px;display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;padding:0 4px;font-size:12px;color:var(--muted)}
#chips::-webkit-scrollbar{display:none}
#rack{display:flex;justify-content:center;gap:6px;padding:9px;border-radius:22px;background:linear-gradient(180deg,var(--soft),var(--bd));border:1px solid var(--line);box-shadow:inset 0 2px 8px var(--sh)}
.slot{width:calc((100% - 36px)/7);max-width:50px;aspect-ratio:1;border-radius:13px;border:1.5px dashed var(--line);position:relative}
.rt{position:absolute;inset:0;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#fffaf0,#efe3c8);color:#3a2f1c;box-shadow:0 3px 0 #d6c5a0,0 5px 10px rgba(60,40,10,.3);font:800 clamp(22px,7vw,30px)/1 var(--serif);touch-action:none;transition:transform .18s}
.rt s{position:absolute;right:5px;bottom:3px;font:700 11px/1 ui-sans-serif,-apple-system,sans-serif;text-decoration:none;opacity:.7}
.rt.sel{transform:translateY(-8px) scale(1.06);box-shadow:0 0 0 2.5px var(--acc),0 10px 16px rgba(60,40,10,.35)}
.rt.bl{color:var(--acc)}
.rt.deal{animation:deal .45s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--i)*.06s)}
@keyframes deal{from{transform:translateY(40px) scale(.6);opacity:0}to{transform:none;opacity:1}}
.rt.ghosted{opacity:.3}
#rack.shake{animation:shk .45s}
@keyframes shk{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
#acts{display:grid;grid-template-columns:repeat(4,46px) 1fr;gap:7px}
.ab{height:48px;border-radius:16px;background:var(--pill);border:1px solid var(--line);font-size:19px;display:grid;place-items:center;transition:transform .15s,opacity .2s}
.ab:active{transform:scale(.92)}
.ab:disabled{opacity:.35}
.ab.sure{background:var(--bad);color:#fff;border-color:var(--bad);font-size:11px;font-weight:700}
.play{height:48px;border-radius:16px;background:var(--inv-bg);color:var(--inv-fg);font-size:16px;font-weight:700;letter-spacing:.2px;transition:transform .15s,opacity .2s,background .3s}
.play:active{transform:scale(.97)}
.play:disabled{opacity:.3}
.play.go{background:var(--acc);color:#fff;animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--acc) 22%,transparent)}}

/* накладки */
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:22px;z-index:20;background:rgba(0,0,0,.42)}
.ov.on{display:flex;animation:fi .25s both}
@keyframes fi{from{opacity:0}to{opacity:1}}
.box{width:100%;max-width:360px;background:var(--bg);border:1px solid var(--line);border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:14px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.88);opacity:0}}
.box h3{font:600 22px var(--serif);text-wrap:balance}
.box p{font-size:14px;color:var(--muted);line-height:1.45}
.lt{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.lt button{aspect-ratio:1;border-radius:11px;background:var(--pill);border:1px solid var(--line);font:700 18px var(--serif)}
.lt button:active{background:var(--acc);color:#fff}
.xr{display:flex;justify-content:center;gap:6px}
.xr .rt{position:relative;width:calc((100% - 36px)/7);max-width:44px;aspect-ratio:1;inset:auto}
.xr .rt.sel{transform:translateY(-6px);box-shadow:0 0 0 2.5px var(--bad)}
.rowb{display:flex;gap:8px}
.rowb>*{flex:1;padding:13px 10px;border-radius:999px;font-size:14px;font-weight:700}
.b1{background:var(--inv-bg);color:var(--inv-fg)}
.b2{background:var(--pill);border:1px solid var(--line)}
.bad{background:var(--bad);color:#fff}
#end{background:var(--bg)}
#end .box{background:transparent;border:0;box-shadow:none}
.big{font-size:58px;line-height:1}
.rw{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border:1.5px solid var(--line);border-radius:18px;font-weight:600;background:var(--pill);text-align:left}
.rw.win{border-color:var(--fg)}
.rw small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
.rw b{font:700 28px var(--serif)}
#fly{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.gh{position:fixed;z-index:40;pointer-events:none;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#fffaf0,#efe3c8);color:#3a2f1c;font:800 28px/1 var(--serif);box-shadow:0 14px 26px rgba(60,40,10,.45),0 0 0 2.5px var(--acc);transform:scale(1.15) rotate(-4deg)}
.sp{position:fixed;font:800 22px var(--serif);color:var(--acc);text-shadow:0 2px 10px rgba(0,0,0,.25);animation:up 1.3s ease-out forwards;white-space:nowrap}
@keyframes up{0%{opacity:0;transform:translate(-50%,6px) scale(.6)}20%{opacity:1;transform:translate(-50%,-6px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-56px) scale(1)}}
.cf{position:fixed;top:-30px;font-size:24px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
#banner{position:fixed;left:50%;top:30%;transform:translate(-50%,-10px) scale(.9);opacity:0;pointer-events:none;background:var(--acc);color:#fff;padding:14px 24px;border-radius:22px;font:800 24px var(--serif);z-index:35;transition:all .35s cubic-bezier(.2,.9,.3,1.3);text-align:center}
#banner.on{opacity:1;transform:translate(-50%,0) scale(1)}
@media(max-height:690px){#pls .pl{padding:6px 10px}.pl .sc{font-size:24px}#acts .ab,.play{height:44px}}

/* ── оформлення до свят ── */
:root[data-skin="halloween"]{--bg:#150f1f;--fg:#f3ead9;--muted:#9a8aa8;--line:#33284a;--pill:#1e1630;--soft:#261c3b;--inv-bg:#ff8a1f;--inv-fg:#1a1024;--ok:#47c98b;--bad:#ff5d73;--sh:rgba(0,0,0,.5);--acc:#ff8a1f;--bd:#2a1f40;--cell:#1e1630}
:root[data-skin="winter"]{--bg:#eef5ff;--fg:#1c2b45;--muted:#6f84a6;--line:#d3e1f5;--pill:#fff;--soft:#e3eefc;--inv-bg:#2563c9;--inv-fg:#fff;--sh:rgba(40,80,140,.12);--acc:#2563c9;--bd:#cfe0f6;--cell:#f7fbff}

<script>
const FB = "https://draw-8cb08-default-rtdb.europe-west1.firebasedatabase.app", ROOM = "k7Qm2xVp9Lr4Tz8n";
const $ = id => document.getElementById(id);
const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } } };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const vib = p => { try { if (ls.get("dm_vib") === "0") return; } catch (e) {} navigator.vibrate && navigator.vibrate(p); };
const other = s => s === "v" ? "a" : "v";

const room = ls.get("dm_room"), me = ls.get("dm_slot");
let L = null; try { L = JSON.parse(ls.get("dm_launch")); } catch (e) {}
if (!room || (me !== "v" && me !== "a") || !L || !L.id) location.replace("index.html");
const fb = `${FB}/rooms/${ROOM}/dm/${room}/erudit`;
function logStat(id, rec) { if (!room || !id) return; rec.t = rec.t || Date.now(); fetch(`${FB}/rooms/${ROOM}/dm/${room}/stats/log/${id}.json`, { method: "PUT", body: JSON.stringify(rec), keepalive: true }).catch(() => {}); }
const PEOPLE = { a: { name: "аліна", emoji: "🦊" }, v: { name: "вадим", emoji: "👻" } };
fetch(`${FB}/rooms/${ROOM}/dm/${room}/players.json`).then(r => r.json()).then(p => { if (p) for (const s of ["v", "a"]) if (p[s] && p[s].name) PEOPLE[s] = { name: p[s].name, emoji: p[s].emoji || PEOPLE[s].emoji }; lastKey = ""; render(); }).catch(() => {});

/* ───── звук ───── */
let ac;
function audio() { if (ls.get("dm_snd") === "0") return null; if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === "suspended") ac.resume(); return ac; }
function tone(f, d = .1, type = "sine", v = .05, t0 = 0) { const a = audio(); if (!a) return; const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0; o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .02); }
const sfx = { put: () => tone(520, .06, "triangle", .05), back: () => tone(330, .06, "triangle", .04), ok: () => [523, 659, 784].forEach((f, i) => tone(f, .18, "triangle", .06, i * .08)), bad: () => tone(160, .25, "sawtooth", .06), opp: () => { tone(440, .08, "triangle", .05); tone(587, .12, "triangle", .05, .07); }, win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .25, "triangle", .06, i * .12)), big: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .2, "triangle", .07, i * .07)) };
addEventListener("pointerdown", () => audio(), { once: true });

/* ───── правила й фішки ───── */
const ALPHA = [["А", 8, 1], ["Б", 2, 3], ["В", 4, 2], ["Г", 2, 3], ["Ґ", 1, 10], ["Д", 3, 2], ["Е", 5, 1], ["Є", 1, 8], ["Ж", 1, 6], ["З", 2, 4], ["И", 6, 1], ["І", 6, 1], ["Ї", 1, 8], ["Й", 2, 4], ["К", 4, 2], ["Л", 4, 2], ["М", 4, 2], ["Н", 6, 1], ["О", 9, 1], ["П", 3, 2], ["Р", 5, 1], ["С", 5, 1], ["Т", 5, 1], ["У", 3, 3], ["Ф", 1, 10], ["Х", 1, 5], ["Ц", 1, 5], ["Ч", 2, 5], ["Ш", 1, 6], ["Щ", 1, 8], ["Ь", 2, 4], ["Ю", 1, 8], ["Я", 3, 3]];
const VAL = { "*": 0 }; ALPHA.forEach(([l, , v]) => VAL[l] = v);
const N = 15, MID = 7, BINGO = 15;
const PREM = (() => {
  const P = Array.from({ length: N }, () => Array(N).fill(""));
  const set = (t, list) => list.forEach(([r, c]) => { P[r][c] = t; });
  set("tw", [[0, 0], [0, 7], [0, 14], [7, 0], [7, 14], [14, 0], [14, 7], [14, 14]]);
  const dw = []; for (let i = 1; i <= 4; i++) { dw.push([i, i], [i, 14 - i], [14 - i, i], [14 - i, 14 - i]); } dw.push([7, 7]); set("dw", dw);
  set("tl", [[1, 5], [1, 9], [5, 1], [5, 5], [5, 9], [5, 13], [9, 1], [9, 5], [9, 9], [9, 13], [13, 5], [13, 9]]);
  set("dl", [[0, 3], [0, 11], [2, 6], [2, 8], [3, 0], [3, 7], [3, 14], [6, 2], [6, 6], [6, 8], [6, 12], [7, 3], [7, 11], [8, 2], [8, 6], [8, 8], [8, 12], [11, 0], [11, 7], [11, 14], [12, 6], [12, 8], [14, 3], [14, 11]]);
  return P;

  const Lt = myRack()[ri]; if (Lt === undefined || usedRi(ri) || cur.board[r][c] || pending.some(p => p.r === r && p.c === c)) return;
  const put1 = (l, b) => { pending.push({ ri, r, c, l, b: b ? 1 : 0 }); sel = null; sfx.put(); vib(8); lastKey = ""; render(); };
  if (Lt === "*") openPicker(l => put1(l, true)); else put1(Lt, false);
}
function unplace(pi) { pending.splice(pi, 1); sfx.back(); lastKey = ""; render(); }
function openPicker(cb) {
  const lt = $("lt"); lt.innerHTML = ""; ALPHA.forEach(([l]) => { const b = document.createElement("button"); b.textContent = l; b.onclick = () => { $("picker").classList.remove("on"); cb(l); }; lt.appendChild(b); });
  $("picker").classList.add("on");
}
$("pkX").onclick = () => $("picker").classList.remove("on");

addEventListener("pointerdown", e => {
  const rt = e.target.closest && e.target.closest(".rt"), pt = e.target.closest && e.target.closest(".tile.pend");
  if ((!rt || rt.closest("#xr")) && !pt) return;
  if (rt && !rt.closest("#rack")) return;
  drag = rt ? { kind: "rack", ri: +rt.dataset.ri, x: e.clientX, y: e.clientY, moved: false, src: rt } : { kind: "pend", pi: +pt.dataset.pi, x: e.clientX, y: e.clientY, moved: false, src: pt };
});
addEventListener("pointermove", e => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 7) {
    drag.moved = true; const g = document.createElement("div"); g.className = "gh";
    const Lt = drag.kind === "rack" ? myRack()[drag.ri] : pending[drag.pi].l; g.textContent = Lt === "*" ? "✦" : Lt; document.body.appendChild(g); drag.ghost = g; drag.src.classList.add("ghosted");
  }
  if (drag.moved) {
    e.preventDefault(); drag.ghost.style.left = e.clientX + "px"; drag.ghost.style.top = (e.clientY - 46) + "px";
    document.querySelectorAll(".cell.hov").forEach(c => c.classList.remove("hov")); const c = cellAt(e.clientX, e.clientY - 46); if (c && !c.querySelector(".tile")) c.classList.add("hov");
  }
}, { passive: false });
function endDrag(e, cancel) {
  if (!drag) return; const d = drag; drag = null;
  document.querySelectorAll(".cell.hov").forEach(c => c.classList.remove("hov"));
  if (d.ghost) d.ghost.remove(); d.src.classList.remove("ghosted");
  if (cancel) return;
  if (!d.moved) { if (d.kind === "rack") { sel = sel === d.ri ? null : d.ri; sfx.back(); lastKey = ""; render(); } else unplace(d.pi); return; }
  const c = cellAt(e.clientX, e.clientY - 46), over = document.elementFromPoint(e.clientX, e.clientY);
  if (c && !c.querySelector(".tile")) { const r = +c.dataset.r, cc = +c.dataset.c; if (d.kind === "pend") { const p = pending[d.pi]; pending.splice(d.pi, 1); const Lt = p.l; pending.push({ ri: p.ri, r, c: cc, l: Lt, b: p.b }); sfx.put(); lastKey = ""; render(); } else place(d.ri, r, cc); }
  else if (d.kind === "pend" && over && over.closest && over.closest("#dock")) unplace(d.pi);
}
addEventListener("pointerup", e => endDrag(e, false)); addEventListener("pointercancel", e => endDrag(e, true));
board.addEventListener("click", e => {
  if (drag) return; const c = e.target.closest(".cell"); if (!c || c.querySelector(".tile")) return;
  if (sel !== null) place(sel, +c.dataset.r, +c.dataset.c);
});

/* ───── кнопки ───── */
$("bShuf").onclick = () => { const k = perm.slice(); for (let i = k.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [k[i], k[j]] = [k[j], k[i]]; } perm = k; sfx.back(); vib(8); lastKey = ""; render(); };
$("bRec").onclick = () => { pending = []; sel = null; sfx.back(); lastKey = ""; render(); };
$("bPlay").onclick = () => {
  const S = cur, pv = preview(); if (!S || !pv || !pv.ok || S.turn !== me || S.pend || S.done) return;
  const c = pendCells(); pending = []; sel = null; vib(25); move({ t: "p", p: me, c });
};
$("bPass").onclick = () => {
  const b = $("bPass");
  if (!b.classList.contains("sure")) { b.classList.add("sure"); b.textContent = "точно?"; clearTimeout(sureT); sureT = setTimeout(() => { b.classList.remove("sure"); b.textContent = "⏭️"; }, 3000); return; }
  clearTimeout(sureT); b.classList.remove("sure"); b.textContent = "⏭️"; pending = []; move({ t: "pass", p: me }); vib(15);
};
let exSel = new Set();
$("bEx").onclick = () => {
  const rack = myRack(), xr = $("xr"); exSel = new Set(); xr.innerHTML = "";
  rack.forEach((l, i) => { const t = document.createElement("div"); t.className = "rt" + (l === "*" ? " bl" : ""); t.innerHTML = l === "*" ? "✦" : `${esc(l)}<s>${VAL[l]}</s>`; t.onclick = () => { exSel.has(i) ? exSel.delete(i) : exSel.add(i); t.classList.toggle("sel", exSel.has(i)); sfx.back(); }; xr.appendChild(t); });
  $("exch").classList.add("on");
};
$("exNo").onclick = () => $("exch").classList.remove("on");
$("exYes").onclick = () => { if (!exSel.size) return; const rack = myRack(), l = [...exSel].map(i => rack[i]); $("exch").classList.remove("on"); pending = []; move({ t: "ex", p: me, l }); vib(15); };
$("chYes").onclick = () => { const S = cur; if (S && S.pend) move({ t: "an", p: me, of: S.pend.of, ok: 1 }); sfx.bad(); };
$("chNo").onclick = () => { const S = cur; if (S && S.pend) move({ t: "an", p: me, of: S.pend.of, ok: 0 }); };
$("back").onclick = () => { location.href = "index.html"; };

/* ───── кінець гри ───── */
function showEnd(g, S) {
  const d = S.done, w = d.winner, b = $("endb");
  const row = s => `<div class="rw${s === w ? " win" : ""}"><span>${esc(PEOPLE[s].emoji)} ${esc(PEOPLE[s].name)}<small>слів: ${S.words[s]}${S.best[s] ? ` · найкраще: ${esc(S.best[s].w)} (${S.best[s].s})` : ""}${S.bingos[s] ? ` · ерудитів: ${S.bingos[s]}` : ""}</small></span><b>${S.scores[s]}</b></div>`;
  b.innerHTML = `<div class="big">${w ? "🏆" : "🤝"}</div><h3>${w ? `перемагає ${esc(PEOPLE[w].emoji)} ${esc(PEOPLE[w].name)}` : "нічия"}</h3><p>${d.reason === "out" ? `${esc(PEOPLE[d.out].name)} першим(ою) вичерпав(ла) усі фішки` : "обоє пропускали ходи"} · фішки, що лишилися, враховано</p>${[w || "v", other(w || "v")].map(row).join("")}<div class="rowb"><button class="b2" data-a="menu">в меню</button><button class="b1" data-a="again">ще раз</button></div>`;
  $("end").classList.add("on"); sfx.win(); vib([30, 50, 30, 50, 90]); confetti();
  logStat(g.id, { g: "erudit", w, s: { v: S.scores.v, a: S.scores.a }, bw: { v: S.best.v, a: S.best.a } });
}
$("end").addEventListener("click", e => { const a = e.target.closest("button")?.dataset.a, g = game(); if (a === "menu") location.href = "index.html"; else if (a === "again" && g) newGame(other(g.first)); });

connect();
layout();
if (L && L.by === me) ensureGame();
</script>
</body>
