<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#fbfbfa">
<script>(function(){try{var t=localStorage.getItem("dm_theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}})()</script>
<link rel="apple-touch-icon" href="IMG_2010.jpeg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔢</text></svg>">
<title>знайди число · draw &amp; more</title>
<style>
:root{--bg:#fbfbfa;--fg:#37352f;--muted:#9b9a97;--line:#e4e4e1;--pill:#fff;--soft:#f1f1ee;--inv-bg:#37352f;--inv-fg:#fff;--ok:#0f7b6c;--bad:#e03e3e;--serif:"Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif}
:root[data-theme="dark"]{--bg:#191919;--fg:#ebebea;--muted:#7f7f7c;--line:#303030;--pill:#202020;--soft:#262626;--inv-bg:#ebebea;--inv-fg:#191919}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#191919;--fg:#ebebea;--muted:#7f7f7c;--line:#303030;--pill:#202020;--soft:#262626;--inv-bg:#ebebea;--inv-fg:#191919}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation}
html,body{height:100%;overflow:hidden}
body{height:100dvh;background:var(--bg);color:var(--fg);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 6px) 8px calc(env(safe-area-inset-bottom,0px) + 8px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
#bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:2px 4px 6px}
#back{justify-self:start;color:var(--muted);font-size:14px;padding:6px 6px 6px 0}
#tgt{text-align:center;line-height:1}
#tgt small{display:block;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
#tn{display:inline-block;min-width:92px;padding:5px 16px 7px;border-radius:18px;background:var(--inv-bg);color:var(--inv-fg);font:700 40px/1 var(--serif);transition:transform .25s}
#tn.pop{animation:tpop .45s cubic-bezier(.2,.9,.3,1.4)}
@keyframes tpop{0%{transform:scale(.6);opacity:.2}100%{transform:scale(1);opacity:1}}
#sc{justify-self:end;text-align:right;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.5}
#sc small{display:block;font-size:11px;color:var(--muted);font-weight:400}
#field{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:18px;background:var(--pill);overflow:hidden}
#box{position:relative;flex:none}
.tk{position:absolute;padding:6px 8px;line-height:1;white-space:nowrap;border-radius:10px;transition:opacity .25s}
.tk.gone{opacity:.18;pointer-events:none}
.tk.ring{opacity:1!important}
.tk.ring::before{content:"";position:absolute;inset:-4px -2px;border-radius:50%;border:3px solid var(--ring,#12a594);animation:rg .55s ease-out both}
@keyframes rg{from{transform:scale(1.8);opacity:0}to{transform:scale(1);opacity:1}}
.tk.wrong{animation:wr .4s}
@keyframes wr{25%{transform:translate(-50%,-50%) rotate(var(--r)) translateX(-6px)}75%{transform:translate(-50%,-50%) rotate(var(--r)) translateX(6px)}}
.tk.wrong{color:var(--bad)!important}
.tk.help::before{content:"";position:absolute;inset:-6px -4px;border-radius:50%;border:2px dashed var(--muted);animation:hp 1s ease-in-out infinite alternate}
@keyframes hp{from{opacity:.2;transform:scale(.9)}to{opacity:1;transform:scale(1.12)}}
#lock{position:absolute;left:0;top:0;height:4px;background:var(--bad);width:100%;transform-origin:left;transform:scaleX(0);pointer-events:none}
#lock.on{animation:lk 1.5s linear forwards}
@keyframes lk{from{transform:scaleX(1)}to{transform:scaleX(0)}}
#cover{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--pill);text-align:center;z-index:3;padding:20px}
#cover.on{display:flex}
#cover b{font:700 84px/1 var(--serif)}
#cover span{color:var(--muted);font-size:15px}
#banner{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;background:var(--inv-bg);color:var(--inv-fg);padding:12px 20px;border-radius:999px;font-size:16px;font-weight:600;white-space:nowrap;z-index:5}
#banner.on{opacity:1;transform:translate(-50%,0)}
.ov{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;z-index:6}
.ov.on{display:flex}
.ov>*{width:100%;max-width:340px}
.ov .big{font-size:56px;line-height:1}
.ov h2{font-family:var(--serif);font-size:28px;font-weight:600;text-wrap:balance}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border:1.5px solid var(--line);border-radius:18px;font-weight:600;background:var(--pill)}
.row.win{border-color:var(--fg)}
.row b{font:700 26px var(--serif)}
.muted{color:var(--muted);font-size:14px}
.go{background:var(--inv-bg);color:var(--inv-fg);padding:15px 0;border-radius:999px;font-size:16px;font-weight:500}
.ghost{border:1px solid var(--line);background:var(--pill);padding:14px 0;border-radius:999px;font-size:15px;font-weight:500}
</style>
</head>
<body>

<header id="bar">
<button id="back">‹ меню</button>
<div id="tgt"><small>знайди</small><b id="tn">–</b></div>
<div id="sc"></div>
</header>
<div id="field">
<div id="lock"></div>
<div id="box"></div>
<div id="cover"></div>
</div>
<div id="banner"></div>
<div class="ov" id="ov"></div>

<script>
const FB = "https://draw-8cb08-default-rtdb.europe-west1.firebasedatabase.app", ROOM = "k7Qm2xVp9Lr4Tz8n";
const $ = id => document.getElementById(id);
const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } } };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const rnd = () => Math.random().toString(36).slice(2, 8);
const vib = p => { try { if (ls.get("dm_vib") === "0") return; } catch (e) {} navigator.vibrate && navigator.vibrate(p); };
const other = s => s === "v" ? "a" : "v";

const room = ls.get("dm_room"), me = ls.get("dm_slot");
let L = null; try { L = JSON.parse(ls.get("dm_launch")); } catch (e) {}
if (!room || (me !== "v" && me !== "a") || !L || !L.id) location.replace("index.html");
const fb = `${FB}/rooms/${ROOM}/dm/${room}/find`;
function logStat(id, rec) {
  if (!room || !id) return;
  rec.t = rec.t || Date.now();
  fetch(`${FB}/rooms/${ROOM}/dm/${room}/stats/log/${id}.json`, { method: "PUT", body: JSON.stringify(rec), keepalive: true }).catch(() => {});
}

const PEOPLE = { a: { name: "аліна", emoji: "🦊" }, v: { name: "вадим", emoji: "👻" } };
fetch(`${FB}/rooms/${ROOM}/dm/${room}/players.json`).then(r => r.json()).then(p => {
  if (p) for (const s of ["v", "a"]) if (p[s] && p[s].name) PEOPLE[s] = { name: p[s].name, emoji: p[s].emoji || PEOPLE[s].emoji };
  tick(true);
}).catch(() => {});

/* ───── дані ───── */
let db = {}, booted = false;
const firstSeen = {};           // коли ми вперше побачили заявку в раунді
const SETTLE = 700;             // вікно, щоб устигла дійти «швидша» заявка суперника
function apply(type, msg) {
  const parts = (msg.path || "/").split("/").filter(Boolean);
  if (!parts.length) { db = type === "put" ? (msg.data || {}) : Object.assign(db, msg.data || {}); return; }
  let o = db;
  for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]] = o[parts[i]] || {};
  const k = parts[parts.length - 1];
  if (type === "put") { if (msg.data === null) delete o[k]; else o[k] = msg.data; }
  else o[k] = Object.assign(o[k] || {}, msg.data);
}
let es;
function connect() {
  if (es) es.close();
  es = new EventSource(fb + ".json");
  ["put", "patch"].forEach(t => es.addEventListener(t, e => {
    try { apply(t, JSON.parse(e.data)); } catch (err) { return; }
    if (!booted) { booted = true; markExisting(); }
    tick();
  }));
}
function markExisting() {  // що було до нашого приходу — вважаємо вирішеним
  const g = db.g; if (!g) return;
  const cl = (db.c && db.c[g.id]) || {};
  Object.keys(cl).forEach(k => { if (firstSeen[g.id + k] === undefined) firstSeen[g.id + k] = 0; });
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) connect(); });

const game = () => { const g = db.g; return g && g.launch === L.id ? g : null; };
function put(path, val) {
  apply("put", { path: "/" + path, data: val });
  return fetch(`${fb}/${path}.json`, { method: "PUT", body: JSON.stringify(val), keepalive: true }).catch(() => {});
}
function newGame() {
  return put("g", { id: rnd(), launch: L.id, goal: +(L.cfg && L.cfg.findN) || 10, seed: Math.floor(Math.random() * 2 ** 31) });
}
async function ensureGame() {
  try { const g = await (await fetch(fb + "/g.json")).json(); if (g && g.launch === L.id) return; } catch (e) {}
  newGame();
}

/* ───── генерація поля (однакова на обох телефонах за seed) ───── */
function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const COLS = ["#e5484d", "#3e63dd", "#12a594", "#f76b15", "#8e4ec6", "#2f9e44", "#d6409f", "#c2860a"];
const FONTS = ["ui-rounded,'SF Pro Rounded',system-ui,sans-serif", "Georgia,'Times New Roman',serif", "'Trebuchet MS',Verdana,sans-serif", "'Courier New',monospace"];
const VW = 100, VH = 180;
function makeRound(seedStr) {
  const R = mulberry(hash(seedStr)), pick = a => a[Math.floor(R() * a.length)];
  const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const rn = () => { const q = R(); return q < .3 ? 1 + Math.floor(R() * 9) : q < .8 ? 10 + Math.floor(R() * 90) : 100 + Math.floor(R() * 900); };
  const k = R(), target = k < .33 ? 1 + Math.floor(R() * 9) : k < .85 ? 10 + Math.floor(R() * 90) : 100 + Math.floor(R() * 900), T = String(target);
  const set = new Set([T]), list = [T], cand = [];
  if (T.length > 1) {
    const rev = [...T].reverse().join(""); if (rev !== T && rev[0] !== "0") cand.push(rev);
    for (let i = 0; i < T.length; i++) for (const d of "0123456789") if (d !== T[i]) { const x = T.slice(0, i) + d + T.slice(i + 1); if (x[0] !== "0") cand.push(x); }
  } else {
    for (const d of "123456789") if (d !== T) cand.push(d);
    for (const d of "0123456789") { cand.push(T + d); if (d !== "0") cand.push(d + T); }
  }
  shuffle(cand).forEach(c => { if (list.length < 11 && !set.has(c)) { set.add(c); list.push(c); } });
  let guard = 0;
  while (list.length < 60 && guard++ < 400) { const s = String(rn()); if (!set.has(s)) { set.add(s); list.push(s); } }
  // розставляємо: ціль першою — вона точно потрапить на поле
  const placed = [], toks = [];
  const order = [list[0], ...shuffle(list.slice(1))];
  for (const s of order) {
    const len = s.length, fs = len === 1 ? 6.5 + R() * 5 : len === 2 ? 5.5 + R() * 4.5 : 5 + R() * 3.5;
    const w = fs * .62 * len + 1.6, h = fs * 1.05 + 1.2, rad = Math.hypot(w, h) * .5 * .9, rot = Math.round((R() - .5) * 80);
    let ok = false, x = 0, y = 0;
    for (let t = 0; t < 90 && !ok; t++) {
      x = rad + 1 + R() * (VW - 2 * rad - 2); y = rad + 1 + R() * (VH - 2 * rad - 2);
      ok = placed.every(p => Math.hypot(p.x - x, p.y - y) > p.r + rad + .4);
    }
    if (!ok) { if (s === T) { x = VW / 2; y = VH / 2; ok = true; } else continue; }
    placed.push({ x, y, r: rad });
    toks.push({ n: s, x, y, rot, fs, col: pick(COLS), ff: pick(FONTS), fw: R() < .5 ? 700 : 800 });
  }
  return { target: T, toks };
}

/* ───── стан розрахунку: рахунок виводиться з заявок, тож гонки немає ───── */
function derive(g) {
  const cl = (db.c && db.c[g.id]) || {}, sc = { v: 0, a: 0 };
  let R = 0, last = null, done = null, pending = false;
  while (true) {
    const c = cl["r" + R]; if (!c) break;
    const arr = ["v", "a"].filter(s => typeof c[s] === "number").sort((x, y) => c[x] - c[y]);
    if (!arr.length) break;
    const key = g.id + "r" + R;
    if (firstSeen[key] === undefined) firstSeen[key] = Date.now();
    if (Date.now() - firstSeen[key] < SETTLE) { pending = true; break; }
    const w = arr[0]; sc[w]++; last = { r: R, w }; R++;
    if (sc[w] >= g.goal) { done = w; break; }
  }
  return { sc, R, last, done, pending };
}

/* ───── екран ───── */
let curGid = "", shownR = -1, inter = null, round = null, phaseG = "wait", countStart = 0;
let claimedR = -1, lockUntil = 0, roundShownAt = 0, ur = 3.5;
const box = $("box"), field = $("field");

function sizeBox() {
  const b = field.getBoundingClientRect(); if (!b.width) return;
  ur = Math.min(b.width / VW, b.height / VH);
  box.style.width = VW * ur + "px"; box.style.height = VH * ur + "px"; box.style.setProperty("--u", ur + "px");
}
addEventListener("resize", sizeBox);

function showCover(html) { const c = $("cover"); c.innerHTML = html; c.classList.add("on"); }
function hideCover() { $("cover").classList.remove("on"); }

function buildRound(g, r) {
  round = makeRound(`${g.seed}:${r}`); claimedR = -1; lockUntil = 0; roundShownAt = Date.now();
  box.innerHTML = round.toks.map((t, i) => `<button class="tk" data-i="${i}" style="left:${t.x / VW * 100}%;top:${t.y / VH * 100}%;font-size:${t.fs * ur}px;color:${t.col};font-family:${t.ff};font-weight:${t.fw};--r:${t.rot}deg;transform:translate(-50%,-50%) rotate(${t.rot}deg)">${t.n}</button>`).join("");
  const tn = $("tn"); tn.textContent = round.target; tn.classList.remove("pop"); void tn.offsetWidth; tn.classList.add("pop");
  $("lock").classList.remove("on");
}

function showBanner(t) { const b = $("banner"); b.textContent = t; b.classList.add("on"); clearTimeout(showBanner.t); showBanner.t = setTimeout(() => b.classList.remove("on"), 1500); }

function renderScore(g, d) {
  const sc = d ? d.sc : { v: 0, a: 0 };
  $("sc").innerHTML = `${PEOPLE.a.emoji} ${sc.a} · ${PEOPLE.v.emoji} ${sc.v}<small>до ${g.goal}</small>`;
}

function tick(force) {
  const g = game();
  if (!g) { $("tn").textContent = "–"; showCover(`<span>чекаємо, поки гру запустить другий гравець…</span>`); return; }
  const d = derive(g);
  // нова гра
  if (curGid !== g.id) {
    curGid = g.id; shownR = -1; inter = null; phaseG = "wait"; countStart = 0; round = null; box.innerHTML = ""; $("ov").classList.remove("on"); $("ov").dataset.k = "";
    sizeBox();
    fetch(`${fb}/ready/${g.id}/${me}.json`, { method: "PUT", body: "true", keepalive: true }).catch(() => {});
    apply("put", { path: `/ready/${g.id}/${me}`, data: true });
  }
  renderScore(g, d);
  const rd = (db.ready && db.ready[g.id]) || {}, both = rd.v && rd.a;
  if (phaseG === "wait") {
    if (!both) { $("tn").textContent = "–"; showCover(`<span>${PEOPLE[other(me)].emoji} ${esc(PEOPLE[other(me)].name)} ще заходить…</span>`); return; }
    const cl = (db.c && db.c[g.id]) || {};
    if (d.done || Object.keys(cl).length) { phaseG = "play"; shownR = d.R; hideCover(); if (d.done) return showFinal(g, d); buildRound(g, d.R); }  // повернулись у гру, що йде
    else { phaseG = "count"; countStart = Date.now(); }
  }
  if (phaseG === "count") {
    const n = 3 - Math.floor((Date.now() - countStart) / 700);
    if (n > 0) { showCover(`<span>готуйся</span><b>${n}</b>`); return; }
    phaseG = "play"; shownR = 0; hideCover(); buildRound(g, 0); vib(15);
  }
  // тривають результати раунду
  if (inter) {
    if (Date.now() >= inter.until) {
      inter = null; shownR = d.R;
      if (d.done) return showFinal(g, d);
      buildRound(g, d.R);
    }
    return;
  }
  if (d.R > shownR && round) {
    const w = d.last.w, tk = box.querySelectorAll(".tk");
    inter = { until: Date.now() + 1400 };
    tk.forEach((el, i) => { const t = round.toks[i]; if (t.n === round.target) { el.classList.add("ring"); el.style.setProperty("--ring", w === me ? "#12a594" : "#e5484d"); } else el.classList.add("gone"); });
    showBanner(w === me ? `✅ +1 тобі` : `${PEOPLE[w].emoji} ${PEOPLE[w].name} був(ла) швидшим(ою)`);
    vib(w === me ? [20, 40, 20] : 40);
    return;
  }
  // підказка, якщо довго шукаємо
  if (round && !d.pending && Date.now() - roundShownAt > 15000 && !box.querySelector(".help")) {
    const el = [...box.querySelectorAll(".tk")].find((e, i) => round.toks[i].n === round.target); if (el) el.classList.add("help");
  }
}
setInterval(() => tick(), 100);

/* ───── тапи ───── */
box.addEventListener("pointerdown", e => {
  const b = e.target.closest(".tk"), g = game();
  if (!b || !g || !round || phaseG !== "play" || inter) return;
  if (Date.now() < lockUntil || claimedR === shownR) return;
  const t = round.toks[+b.dataset.i];
  if (t.n !== round.target) {
    lockUntil = Date.now() + 1500; vib([30, 40, 30]);
    b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong");
    const l = $("lock"); l.classList.remove("on"); void l.offsetWidth; l.classList.add("on");
    return;
  }
  // правильно — фіксуємо заявку з часом сервера: хто раніше, той і виграв
  claimedR = shownR; vib(15);
  b.classList.add("ring"); b.style.setProperty("--ring", "#12a594");
  const key = g.id + "r" + shownR; if (firstSeen[key] === undefined) firstSeen[key] = Date.now();
  fetch(`${fb}/c/${g.id}/r${shownR}/${me}.json`, { method: "PUT", body: JSON.stringify({ ".sv": "timestamp" }), keepalive: true }).catch(() => {});
});

/* ───── фінал ───── */
function showFinal(g, d) {
  hideCover(); $("tn").textContent = "🏁";
  const sc = d.sc, win = d.done, ov = $("ov");
  if (ov.dataset.k !== g.id) {
    ov.dataset.k = g.id;
    ov.innerHTML = `<div class="big">🏆</div><h2>перемагає ${esc(PEOPLE[win].emoji)} ${esc(PEOPLE[win].name)}</h2><div class="muted">гра до ${g.goal}</div>` +
      ["a", "v"].map(s => `<div class="row${s === win ? " win" : ""}"><span>${esc(PEOPLE[s].emoji)} ${esc(PEOPLE[s].name)}</span><b>${sc[s]}</b></div>`).join("") +
      `<button class="go" data-a="again">ще раз</button><button class="ghost" data-a="menu">в меню</button>`;
    vib([30, 50, 30, 50, 90]);
    logStat(g.id, { g: "find", w: win, s: { v: sc.v, a: sc.a } });
  }
  ov.classList.add("on");
}
$("ov").addEventListener("click", e => {
  const a = e.target.closest("button")?.dataset.a;
  if (a === "menu") location.href = "index.html";
  else if (a === "again") newGame();
});
$("back").addEventListener("click", () => { location.href = "index.html"; });

connect();
sizeBox();
if (L && L.by === me) ensureGame();
</script>
</body>
</html>
