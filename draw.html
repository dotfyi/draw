<title>draw to me</title>
<style>
:root {
--bg: #fbfbfa; --fg: #37352f; --muted: #9b9a97; --line: #e4e4e1; --pill: #ffffff;
--inv-bg: #37352f; --inv-fg: #ffffff;
--serif: "Iowan Old Style", "Palatino Linotype", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
:root { --bg: #191919; --fg: #ebebea; --muted: #7f7f7c; --line: #303030; --pill: #202020; --inv-bg: #ebebea; --inv-fg: #191919; }
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
height: 100dvh; background: var(--bg); color: var(--fg);
font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
-webkit-font-smoothing: antialiased; display: flex; flex-direction: column; align-items: center;
user-select: none; -webkit-user-select: none;
padding: calc(env(safe-area-inset-top, 0px) + 44px) 24px calc(env(safe-area-inset-bottom, 0px) + 28px);
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--muted); outline-offset: 2px; }
.screen { display: none; flex: 1; width: 100%; max-width: 400px; flex-direction: column; align-items: center; min-height: 0; }
.screen.on { display: flex; }
.muted { color: var(--muted); font-size: 14px; }

/* лобі */
#lobby { justify-content: safe center; gap: 14px; text-align: center; position: relative; overflow-y: auto; padding: 4px 0; }
.opts { display: flex; flex-direction: column; gap: 12px; width: 100%; }
.ol { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.og { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip2 { padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--pill); font-size: 14px; color: var(--muted); transition: border-color .2s, color .2s; }
.chip2.on { border-color: var(--fg); color: var(--fg); font-weight: 600; }
#rask { margin-top: 12px; font-size: 14px; color: var(--muted); }
.cf { position: fixed; top: -30px; left: var(--x); font-size: 22px; animation: fall var(--d) linear forwards; pointer-events: none; z-index: 9; }
@keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
@keyframes pulse { 50% { transform: scale(1.25); } }
.big { font-size: 52px; line-height: 1; }
h1 { font-family: var(--serif); font-size: 32px; font-weight: 600; text-wrap: balance; }
.who { display: flex; gap: 12px; margin: 4px 0 2px; }
.who-b { width: 118px; padding: 16px 0 14px; border: 1px solid var(--line); border-radius: 20px; background: var(--pill); display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; color: var(--muted); transition: border-color .2s, color .2s, transform .15s; }
.who-b .e { font-size: 40px; line-height: 1; filter: grayscale(.9); opacity: .5; transition: opacity .2s, filter .2s; }
.who-b.on { border-color: var(--fg); color: var(--fg); }
.who-b.on .e { filter: none; opacity: 1; }
.who-b:active { transform: scale(.97); }
.go:disabled { opacity: .35; cursor: default; }
.go { background: var(--inv-bg); color: var(--inv-fg); padding: 15px 44px; border-radius: 999px; font-size: 16px; font-weight: 500; margin-top: 6px; transition: transform .15s; }
.go:active { transform: scale(.96); }
.ghost-btn { border: 1px solid var(--line); background: var(--pill); padding: 11px 26px; border-radius: 999px; font-size: 15px; font-weight: 500; }

/* відлік */
#ready { justify-content: center; gap: 8px; }
#num { font-family: var(--serif); font-size: 150px; font-weight: 700; line-height: 1; }

/* малювання */
#timer { font-size: 15px; font-weight: 500; color: var(--muted); height: 20px; font-variant-numeric: tabular-nums; transition: color .3s; }
#timer.hot { color: var(--fg); font-weight: 700; animation: pulse 1s infinite; }
#word { font-family: var(--serif); font-size: 30px; font-weight: 600; text-align: center; margin: 6px 0 14px; text-wrap: balance; }
.cwrap { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
canvas { background: #fff; border: 1px solid var(--line); border-radius: 16px; touch-action: none; display: block; }
.tools { margin-top: 8px; display: flex; align-items: center; gap: 2px; padding: 6px; border: 1px solid var(--line); border-radius: 999px; background: var(--pill); }
.t { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; transition: background .2s, color .2s; }
.t.on { background: var(--inv-bg); color: var(--inv-fg); }
.t svg { width: 22px; height: 22px; }
.palette { margin-top: 10px; display: flex; gap: 9px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--pill); }
.sw { width: 22px; height: 22px; border-radius: 50%; transition: transform .15s, box-shadow .15s; }
.sw.on { transform: scale(1.12); box-shadow: 0 0 0 2px var(--pill), 0 0 0 3px var(--fg); }
.sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }

/* очікування */
#wait { justify-content: center; gap: 14px; text-align: center; position: relative; }
#wait .eyes { font-size: 40px; line-height: 1; }
#wait .ghost-btn { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); white-space: nowrap; }
#wait .big { animation: float 2.4s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-10px); } }

/* результат */
#reveal { overflow-y: auto; gap: 16px; padding-bottom: 8px; justify-content: flex-start; touch-action: pan-y; }
.rword { font-family: var(--serif); font-size: 26px; font-weight: 600; text-align: center; }
figure { width: min(100%, 330px); text-align: center; flex-shrink: 0; }
.frame { border: 1px solid var(--line); border-radius: 16px; background: #fff; overflow: hidden; }
figure img { width: 100%; aspect-ratio: 3 / 4; display: block; -webkit-touch-callout: default; user-select: auto; -webkit-user-select: auto; }
figcaption { padding: 11px 12px; border-top: 1px solid #ececea; background: #fff; font-size: 16px; font-weight: 500; color: #1f1e1b; text-align: center; }
.rate { margin-top: 12px; display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; }
.rate button { padding: 9px 14px; border-radius: 999px; font-size: 15px; font-weight: 500; border: 1px solid var(--line); background: var(--pill); transition: background .2s, color .2s, opacity .2s; }
.rate button.on { background: var(--inv-bg); color: var(--inv-fg); border-color: var(--inv-bg); }
.rate button:disabled { cursor: default; opacity: .4; }
.rate button.on:disabled { opacity: 1; }
.rinfo { margin-top: 12px; min-height: 38px; display: flex; justify-content: center; align-items: center; font-size: 14px; color: var(--muted); }
.chip { display: inline-block; padding: 8px 16px; border-radius: 999px; background: var(--inv-bg); color: var(--inv-fg); font-size: 15px; font-weight: 500; }
.rv { animation: rv .9s cubic-bezier(.2,.7,.2,1) both; }
.rv.late { animation-delay: .8s; }
@keyframes rv { from { opacity: 0; filter: blur(14px); transform: scale(.96); } to { opacity: 1; filter: blur(0); transform: none; } }
@media (prefers-reduced-motion: reduce) { .rv, #wait .big, #timer.hot, .cf { animation: none; } }

/* фінал */
#final { justify-content: center; gap: 16px; text-align: center; }
#ftitle { font-size: 28px; text-wrap: balance; }
.board { width: 100%; display: flex; flex-direction: column; gap: 10px; margin: 6px 0 2px; }
.row { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border: 1px solid var(--line); border-radius: 18px; background: var(--pill); text-align: left; }
.row.win { border-color: var(--fg); }
.row .em { font-size: 30px; line-height: 1; }
.row .nm { flex: 1; font-size: 16px; font-weight: 600; }
.row .sub { font-size: 13px; font-weight: 400; color: var(--muted); margin-top: 3px; }
.row .pts { font-family: var(--serif); font-size: 30px; font-weight: 700; }

/* супер гра */
.sg { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 6px); left: 0; right: 0; margin: 0 auto; width: max-content; z-index: 5; padding: 7px 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--pill); font-size: 14px; font-weight: 600; }
.sg:active { transform: scale(.96); }
[hidden] { display: none !important; }
body.relay { padding: calc(env(safe-area-inset-top, 0px) + 10px) 10px calc(env(safe-area-inset-bottom, 0px) + 10px); }
body.relay #draw { max-width: none; }
body.relay #word { font-size: 20px; margin: 2px 0 8px; }
body.relay #done { display: none; }
#rl { overflow-y: auto; text-align: center; }
.rlb { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; margin: auto 0; padding: 8px 0; }
</style>
</head>

const SIZE = { thin: 4, thick: 13, erase: 30 };
const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
function style(st) {
ctx.lineCap = ctx.lineJoin = "round";
ctx.strokeStyle = st.e ? "#fff" : st.c;
ctx.fillStyle = ctx.strokeStyle;

}

/* ───── годинник сервера (щоб таймери в обох збігались) ───── */
let skew = 0;

async function syncClock() {

const ac = new AbortController(), to = setTimeout(() => ac.abort(), 2500);
const t0 = Date.now();
const res = await fetch(`${FIREBASE_URL}/rooms/${ROOM}/ping.json`, { method: "PUT", body: JSON.stringify({ ".sv": "timestamp" }), signal: ac.signal });

}

/* ───── дані гри ───── */
const node = (root, mid, r, w) => { const x = db[root]; return (x && x[mid] && x[mid]["r" + r] && x[mid]["r" + r][w]) || null; };

}

const match = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), words: pool.slice(0, n), startAt: nowS() + 800, by: me, mode: cfg.mode, rounds: n, dur: cfg.dur };

}
// поточний раунд = перший, який ще не оцінили обидва
function curRound() {

ROUNDS = m.rounds || 5; DUR = m.dur || 60000;
for (let r = 0; r < ROUNDS; r++)
if (!(R(m.id, r, "v") && R(m.id, r, "a"))) return { m, r, start: roundStart(m, r) };

/* екран завжди виводиться з даних і серверного часу */

/* ───── фінал ───── */
function showFinal(m) {
const S = { v: { pts: 0, great: 0, time: 0 }, a: { pts: 0, great: 0, time: 0 } };
for (let r = 0; r < ROUNDS; r++) {
const ds = roundStart(m, r) + READY;
for (const w of ["v", "a"]) {
const art = A(m.id, r, w), rt = R(m.id, r, m.mode === "guess" ? w : otherOf(w));
if (!art || !rt) continue;
const el = Math.max(0, Math.min(DUR, art.t - ds));
S[w].pts += (RATE[rt.v] ? RATE[rt.v].p : 0) + Math.round(3 * (1 - el / DUR)); // оцінка + бонус за швидкість (0–3)
if (rt.v === "чудово" || rt.v === "вгадав") S[w].great++;
S[w].time += el;
}
}
const tie = S.v.pts === S.a.pts;
const win = S.v.pts > S.a.pts ? "v" : "a";
$("ftitle").textContent = tie ? "нічия, вітаю обох" : `вітаю, ${PEOPLE[win].name} ${PEOPLE[win].won}`;

["v", "a"].sort((x, y) => S[y].pts - S[x].pts).forEach(w => {
const row = document.createElement("div");
row.className = "row" + (!tie && w === win ? " win" : "");

row.append(em, nm, pts); board.appendChild(row);

}

const m = db.match;
if (!m || !m.id) { show("lobby"); return; }
if (!confirm("закінчити гру і вийти в меню?")) return;
put("match/over", true);
show("lobby"); paintWho();
});
$("start").addEventListener("click", startMatch);
$("again").addEventListener("click", startMatch);
$("tomenu").addEventListener("click", () => { if (db.match) joined.delete(db.match.id); show("lobby"); paintWho(); });

/* ───── супер гра: естафета малюнків ───── */
const RD = 30000, RG = 2500, RN = 5; // 30 с на раунд, пауза на обмін, 5 раундів
let relayOn = false, relayDone = false, relayId = "", relayR = -1, bgReady = true;
const relayJoined = new Set();
const rArt = (r, w) => { const x = db.relay; return (x && x.art && x.art["r" + r] && x.art["r" + r][w]) || null; };

function relayJoin(id) {
relayJoined.add(id); relayId = id; relayOn = true; relayDone = false; relayR = -1; bgImg = null; bgReady = true;
document.body.classList.add("relay");
}
function relayExit() {
relayOn = false; relayDone = false; relayR = -1; bgImg = null;
document.body.classList.remove("relay"); show("lobby"); paintWho();
}
async function relayStart() {
if (!me) { alert("спершу обери: вадим чи аліна"); return; }
if (!online) return;
await syncClock();
const g = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), startAt: nowS() + 1500, by: me };
relayJoin(g.id); put("relay", g);
}
function swapView(r) {
const o = otherOf(me);
if (phase !== "rl") show("rl");
$("rlSwap").hidden = false; $("rlFin").hidden = true;
const wait = r < RN && rArt(r, me) && !rArt(r, o);
const s = `${Math.min(r + 1, RN)}/${RN} · ` + (wait ? `чекаю ${PEOPLE[o].name}…` : "малюнки міняються місцями ✈️");
if ($("rlTxt").textContent !== s) $("rlTxt").textContent = s;
}
function enterRelayDraw(r) {
relayR = r; strokes = []; cur = null; bgImg = null;
const o = otherOf(me), prev = r ? rArt(r - 1, o) : null;
bgReady = !prev;
if (prev) {
const im = new Image();
im.onload = () => { if (relayR === r) { bgImg = im; bgReady = true; redraw(); } };
im.onerror = () => { bgReady = true; };
im.src = prev.img;
}
$("word").textContent = r ? `доповни малюнок ${PEOPLE[o].gen}` : "малюй що завгодно ✨";
lastTick = 0; show("draw"); fit(); redraw(); vib(40); snd([523, 784]);
}
function rFinish(r, end) {
if (rArt(r, me) || !bgReady) return;
const img = cv.toDataURL("image/jpeg", 0.8);
cur = null; vib([30, 40, 30]); snd([784, 988]);
put(`relay/art/r${r}/${me}`, { img, t: Math.min(nowS(), end + 4000) });
}
function showRelayFinal() {
relayDone = true;
// показуємо тільки той малюнок, який почав(ла) інший
const o = otherOf(me), a = rArt(RN - 1, o);
$("rfA").src = a ? a.img : "";
$("rfCapA").textContent = `старт: ${PEOPLE[o].name} ${PEOPLE[o].emoji}`;
show("rl"); $("rlSwap").hidden = true; $("rlFin").hidden = false; $("rl").scrollTop = 0;
document.querySelectorAll("#rlFin figure").forEach(f => { f.classList.remove("rv"); void f.offsetWidth; f.classList.add("rv"); });
vib([30, 50, 30, 50, 90]); snd([523, 659, 784, 1047], .15); confetti();
}
function rtick() {
const x = db.relay, t = nowS();
if (!me || !x || !x.id) return;
const canJoin = (!relayOn && phase === "lobby") || (relayOn && relayDone);
if (canJoin && x.id !== relayId && x.by !== me && !relayJoined.has(x.id) && t < x.startAt + READY + 8000) {
relayJoin(x.id); notify("супер гра починається! 🎨");
}
if (!relayOn || x.id !== relayId) return;
let r = 0;
while (r < RN && rArt(r, "v") && rArt(r, "a")) r++;
const ds = r ? Math.max(rArt(r - 1, "v").t, rArt(r - 1, "a").t) + RG : x.startAt + READY;
if (r === RN) { if (t >= ds) { if (!relayDone) showRelayFinal(); } else swapView(r); return; }
if (rArt(r, me)) return swapView(r);
if (t < ds) {
if (r) return swapView(r);
if (phase !== "ready") show("ready");
setNum(0, Math.min(3, Math.ceil((ds - t) / 1000)));
$("rlabel").textContent = "супер гра 🎨";
return;
}
const end = ds + RD;
if (relayR !== r) enterRelayDraw(r);
if (t >= end) return rFinish(r, end);
const s = Math.ceil((end - t) / 1000);
$("timer").textContent = `${r + 1}/${RN} · 0:${String(s).padStart(2, "0")}`;
$("timer").classList.toggle("hot", s <= 10);
if (s <= 5 && s !== lastTick) { lastTick = s; snd([880], .07, "square", .03); }
}
$("sg").addEventListener("click", relayStart);
$("rlAgain").addEventListener("click", relayStart);
$("rlMenu").addEventListener("click", relayExit);
$("rlOut").addEventListener("click", () => { if (confirm("вийти з гри?")) relayExit(); });
setInterval(rtick, 200);

setInterval(update, 200);

/* ───── звʼязок із Firebase ───── */
function apply(type, msg) {
const parts = (msg.path || "/").split("/").filter(Boolean);
if (!parts.length) { db = type === "put" ? (msg.data || {}) : Object.assign(db, msg.data || {}); return; }
let o = db;
for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]] = o[parts[i]] || {};
const k = parts[parts.length - 1];
if (type === "put") { if (msg.data === null) delete o[k]; else o[k] = msg.data; }
else o[k] = Object.assign(o[k] || {}, msg.data);
}
let es;
function connect() {
if (!online) { $("status").textContent = "додай Firebase, щоб грати вдвох"; return; }
if (es) es.close();
$("status").textContent = "";
es = new EventSource(base + ".json");
es.onopen = () => $("status").textContent = "";
es.onerror = () => $("status").textContent = "шукаю звʼязок…";
["put", "patch"].forEach(type => es.addEventListener(type, e => {
try { apply(type, JSON.parse(e.data)); update(); } catch (err) {}
}));
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) { syncClock(); connect(); beat(); } });
syncClock().then(beat);
connect();
</script>
