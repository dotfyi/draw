<style>
:root{--bg:#fbfbfa;--fg:#37352f;--muted:#9b9a97;--line:#e4e4e1;--pill:#fff;--soft:#f1f1ee;--inv-bg:#37352f;--inv-fg:#fff;--ok:#0f7b6c;--bad:#e03e3e;--sh:rgba(30,30,20,.1);--acc:#d65bc6;--serif:"Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation}
html,body{height:100%;overflow:hidden}
body{height:100dvh;background:var(--bg);color:var(--fg);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
background-image:radial-gradient(520px 320px at 50% -60px,color-mix(in srgb,var(--acc) 16%,transparent),transparent 70%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
#app{height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 6px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
#top{display:flex;align-items:center;justify-content:space-between;min-height:28px}
#back{color:var(--muted);font-size:14px;padding:6px 8px 6px 0}
#info{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* гравці */
#pls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pl{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:20px;background:var(--pill);border:1.5px solid var(--line);box-shadow:0 6px 16px var(--sh);min-width:0;transition:border-color .3s,box-shadow .3s}
.pl .av{font-size:24px;line-height:1}
.pl .tx{flex:1;min-width:0}
.pl .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .st{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;height:14px}
.pl .sc{font:700 26px var(--serif);line-height:1;font-variant-numeric:tabular-nums}
.pl .mini{display:grid;grid-template-columns:repeat(5,5px);gap:2px}
.pl .mini i{width:5px;height:5px;border-radius:1.5px;background:var(--line);transition:background .3s}
.pl .mini i.on{background:var(--acc)}

#ringw{position:relative;width:122px;height:122px;flex:none}

#main{position:absolute;inset:11px;display:grid;place-items:center}
.ball{position:relative;width:100%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:#1b1b1a;
background:radial-gradient(circle at 34% 28%,#fff 0,var(--b1) 0,var(--b2) 62%,var(--b3) 100%);box-shadow:0 12px 22px rgba(0,0,0,.28),inset 0 -6px 12px rgba(0,0,0,.22)}
.ball::before{content:"";position:absolute;inset:23%;border-radius:50%;background:#fffdf7;box-shadow:inset 0 2px 6px rgba(0,0,0,.18)}
.ball .bl,.ball .bn{position:relative;z-index:1;font-weight:900;line-height:1}
.ball .bl{font-size:.9em;letter-spacing:1px;margin-bottom:-2px;color:var(--b3)}
.ball .bn{font:900 1.9em/1 var(--serif)}

.ball.B{--b1:#b8d4ff;--b2:#4d8dff;--b3:#1f4fb8}
.ball.I{--b1:#ffc0ca;--b2:#ff5a73;--b3:#b01f3b}
.ball.N{--b1:#f1f3f8;--b2:#a9b1c4;--b3:#5d667d}
.ball.G{--b1:#b6f5d8;--b2:#2ee59d;--b3:#0a8f5f}
.ball.O{--b1:#ffe3a6;--b2:#ffb020;--b3:#b36b00}
#side{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1;max-width:190px}
#left{font-size:12px;color:var(--muted)}

#hist{display:flex;gap:5px;flex-wrap:wrap}
#hist .ball{width:30px;font-size:8px;opacity:var(--o,1)}
#hist .ball::before{inset:21%}
#hist .ball .bl{display:none}
#hist .ball .bn{font-size:1.9em}

/* картка */
#cw{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#cols{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;width:min(100%,calc(100dvh - 430px),360px);min-width:230px}

#card{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;width:min(100%,calc(100dvh - 430px),360px);min-width:230px}
.cell{position:relative;aspect-ratio:1;border-radius:18px;background:var(--pill);border:1px solid var(--line);box-shadow:0 5px 12px var(--sh);display:grid;place-items:center;font:700 clamp(17px,5.4vw,24px)/1 var(--serif);font-variant-numeric:tabular-nums;transition:transform .15s,background .25s}
.cell:active{transform:scale(.93)}
.cell .d{position:absolute;inset:11%;border-radius:50%;background:radial-gradient(circle at 32% 28%,color-mix(in srgb,var(--acc) 55%,#fff),var(--acc) 62%,color-mix(in srgb,var(--acc) 70%,#000));box-shadow:0 4px 10px color-mix(in srgb,var(--acc) 50%,transparent),inset 0 -3px 6px rgba(0,0,0,.2);transform:scale(0);opacity:0}
.cell.m .d{animation:stamp .38s cubic-bezier(.2,.9,.3,1.4) forwards}
@keyframes stamp{0%{transform:scale(2.2);opacity:0}60%{opacity:1}100%{transform:scale(1);opacity:.96}}
.cell .n{position:relative;z-index:1;transition:color .2s}
.cell.m .n{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35)}

.cell.hint{animation:hint 1.4s ease-in-out infinite}

.cell.no{animation:nope .38s}
@keyframes nope{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cell.win{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc),0 0 24px color-mix(in srgb,var(--acc) 55%,transparent)}

#bingo:active{transform:scale(.97)}
#bingo:disabled{opacity:.28;filter:grayscale(.6);box-shadow:none}
#bingo.go{animation:pulse 1.2s ease-in-out infinite}

@keyframes pulse{50%{transform:scale(1.025);box-shadow:0 18px 38px color-mix(in srgb,#7a6cff 55%,transparent)}}
@keyframes sw{0%{transform:translateX(-120%)}60%,100%{transform:translateX(120%)}}

#cover{background:color-mix(in srgb,var(--bg) 92%,transparent)}

.big{font-size:60px;line-height:1}
#res{background:color-mix(in srgb,var(--bg) 86%,transparent);pointer-events:none}
#res .bg{font:900 56px/1 var(--serif);letter-spacing:2px;background:linear-gradient(100deg,#d65bc6,#7a6cff,#4d8dff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:pop .6s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
#end{background:var(--bg)}
.rw{display:flex;justify-content:space-between;align-items:center;width:min(100%,320px);padding:13px 18px;border:1.5px solid var(--line);border-radius:18px;font-weight:600;background:var(--pill)}
.rw.win{border-color:var(--fg)}

.go2{background:var(--inv-bg);color:var(--inv-fg);width:min(100%,320px);padding:15px 0;border-radius:999px;font-size:16px;font-weight:500}
.gh2{border:1px solid var(--line);background:var(--pill);width:min(100%,320px);padding:14px 0;border-radius:999px;font-size:15px;font-weight:500}
#fly{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.cf{position:fixed;top:-30px;font-size:24px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media(max-height:700px){#stage{min-height:112px}#ringw{width:104px;height:104px}#cols,#card{width:min(100%,calc(100dvh - 395px),340px)}#bingo{height:52px}}

/* ── оформлення до свят ── */
:root[data-skin="halloween"]{--bg:#150f1f;--fg:#f3ead9;--muted:#9a8aa8;--line:#33284a;--pill:#1e1630;--soft:#261c3b;--inv-bg:#ff8a1f;--inv-fg:#1a1024;--ok:#47c98b;--bad:#ff5d73;--sh:rgba(0,0,0,.5);--acc:#ff8a1f}

<div id="app">
  <header id="top"><button id="back">‹ меню</button><div id="info"></div></header>

<script>
const FB = "https://draw-8cb08-default-rtdb.europe-west1.firebasedatabase.app", ROOM = "k7Qm2xVp9Lr4Tz8n";
const $ = id => document.getElementById(id);
const ls = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const rnd = () => Math.random().toString(36).slice(2, 8);
const vib = p => { try { if (ls.get("dm_vib") === "0") return; } catch (e) {} navigator.vibrate && navigator.vibrate(p); };
const other = s => s === "v" ? "a" : "v";

const room = ls.get("dm_room"), me = ls.get("dm_slot");
let L = null; try { L = JSON.parse(ls.get("dm_launch")); } catch (e) {}
if (!room || (me !== "v" && me !== "a") || !L || !L.id) location.replace("index.html");
const BOT = (L && L.bot && L.bot !== me) ? L.bot : null, BLVL = +(L && L.cfg && L.cfg.botLvl) || 2;
const fb = `${FB}/rooms/${ROOM}/dm/${room}/bingo`;
function logStat(id, rec) { if (!room || !id || BOT) return; rec.t = rec.t || Date.now(); fetch(`${FB}/rooms/${ROOM}/dm/${room}/stats/log/${id}.json`, { method: "PUT", body: JSON.stringify(rec), keepalive: true }).catch(() => {}); }
const PEOPLE = { a: { name: "аліна", emoji: "🦊" }, v: { name: "вадим", emoji: "👻" } };
if (BOT) PEOPLE[BOT] = { name: "бот", emoji: "🤖" };
fetch(`${FB}/rooms/${ROOM}/dm/${room}/players.json`).then(r => r.json()).then(p => {
  if (p) for (const s of ["v", "a"]) if (p[s] && p[s].name) PEOPLE[s] = { name: p[s].name, emoji: p[s].emoji || PEOPLE[s].emoji };
  if (BOT) PEOPLE[BOT] = { name: "бот", emoji: "🤖" };
  lastPl = ""; tick();
}).catch(() => {});

/* ───── звук ───── */
let ac;
function audio() { if (ls.get("dm_snd") === "0") return null; if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === "suspended") ac.resume(); return ac; }
function tone(f, d = .1, type = "sine", v = .05, t0 = 0) { const a = audio(); if (!a) return; const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0; o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .02); }
const sfx = { ball: () => { tone(300, .18, "triangle", .05); tone(480, .12, "triangle", .04, .1); }, mark: () => tone(700, .06, "triangle", .05), no: () => tone(170, .16, "sawtooth", .05), win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .22, "triangle", .06, i * .09)), lose: () => tone(220, .3, "sine", .05), cnt: () => tone(520, .08, "square", .03) };
addEventListener("pointerdown", () => audio(), { once: true });

/* ───── правила: картка, кульки, лінії ───── */
function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const shuf = (a, R) => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const LET = "BINGO";
const letterOf = n => LET[Math.floor((n - 1) / 15)];
const seqFor = (seed, r) => shuf(Array.from({ length: 75 }, (_, i) => i + 1), mulberry(hash(`${seed}:s:${r}`)));
function cardFor(seed, r, slot) {   // card[row][col]; 0 = вільна клітинка
  const R = mulberry(hash(`${seed}:c:${r}:${slot}`)), card = Array.from({ length: 5 }, () => Array(5).fill(0));
  for (let c = 0; c < 5; c++) shuf(Array.from({ length: 15 }, (_, i) => c * 15 + i + 1), R).slice(0, 5).forEach((n, r2) => { card[r2][c] = n; });
  card[2][2] = 0; return card;
}
const LINES = (() => { const L2 = []; for (let r = 0; r < 5; r++) L2.push([0, 1, 2, 3, 4].map(c => [r, c])); for (let c = 0; c < 5; c++) L2.push([0, 1, 2, 3, 4].map(r => [r, c])); L2.push([0, 1, 2, 3, 4].map(i => [i, i])); L2.push([0, 1, 2, 3, 4].map(i => [i, 4 - i])); return L2; })();
const lineNums = (card, ln) => LINES[ln].map(([r, c]) => card[r][c]).filter(Boolean);
const COUNT = 3300, SETTLE = 700;
const nAt = (T, ps, intv) => T < ps ? 0 : Math.min(75, Math.floor((T - ps) / intv) + 1);
function validClaim(g, r, sl, c, ps) {
  if (!c || typeof c.t !== "number" || !Number.isInteger(c.ln) || c.ln < 0 || c.ln > 11) return false;
  const k = nAt(c.t + 300, ps, g.int), drawn = new Set(seqFor(g.seed, r).slice(0, k));
  return lineNums(cardFor(g.seed, r, sl), c.ln).every(x => drawn.has(x));
}
function needAt(card, drawn) { let best = 5; LINES.forEach((_, ln) => { const miss = lineNums(card, ln).filter(x => !drawn.has(x)).length; if (miss < best) best = miss; }); return best; }
function lineDone(card, marks) { for (let ln = 0; ln < 12; ln++) if (lineNums(card, ln).every(x => marks.has(x))) return ln; return -1; }

/* ───── дані ───── */
let db = {}, es, booted = false;
const firstSeen = {};
function apply(type, msg) {
  const parts = (msg.path || "/").split("/").filter(Boolean);
  if (!parts.length) { db = type === "put" ? (msg.data || {}) : Object.assign(db, msg.data || {}); return; }
  let o = db;
  for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]] = o[parts[i]] || {};
  const k = parts[parts.length - 1];
  if (type === "put") { if (msg.data === null) delete o[k]; else o[k] = msg.data; } else o[k] = Object.assign(o[k] || {}, msg.data);
}
function connect() { if (es) es.close(); es = new EventSource(fb + ".json"); ["put", "patch"].forEach(t => es.addEventListener(t, e => { try { apply(t, JSON.parse(e.data)); } catch (err) { return; } if (!booted) { booted = true; markExisting(); } tick(); })); }
function markExisting() { const g = db.g; if (!g) return; const cl = (db.cl && db.cl[g.id]) || {}; Object.keys(cl).forEach(k => { if (firstSeen[g.id + k] === undefined) firstSeen[g.id + k] = 0; }); }
document.addEventListener("visibilitychange", () => { if (!document.hidden) connect(); });
function put(path, val, local = true) { if (local) apply("put", { path: "/" + path, data: val }); return fetch(`${fb}/${path}.json`, { method: "PUT", body: JSON.stringify(val), keepalive: true }).catch(() => {}); }
const game = () => { const g = db.g; return g && g.launch === L.id ? g : null; };
function newGame() { const c = (L && L.cfg) || {}; return put("g", { id: rnd(), launch: L.id, target: +c.bingoN || 3, int: +c.bingoSpd || 2200, auto: +c.bingoAuto ? 1 : 0, seed: Math.floor(Math.random() * 2 ** 31), first: L.by }); }
async function ensureGame() { try { const g = await (await fetch(fb + "/g.json")).json(); if (g && g.launch === L.id) return; } catch (e) {} newGame(); }

let offset = 0, calibrated = false;
async function calibrate() {
  let best = null;
  for (let i = 0; i < 3; i++) { try { const t0 = Date.now(); await fetch(`${fb}/off/${me}.json`, { method: "PUT", body: JSON.stringify({ ".sv": "timestamp" }) }); const t1 = Date.now(), ts = await (await fetch(`${fb}/off/${me}.json`)).json(), rtt = t1 - t0; if (typeof ts === "number" && (!best || rtt < best.rtt)) best = { rtt, off: ts - (t0 + rtt / 2) }; } catch (e) {} }
  if (best) offset = best.off; calibrated = true;
}
const srv = () => Date.now() + offset;

function derive(g) {
  const cl = (db.cl && db.cl[g.id]) || {}, st = (db.st && db.st[g.id]) || {}, wins = { v: 0, a: 0 };
  let R = 0, last = null, done = null, pend = null;
  for (; ; R++) {
    const s = st["r" + R], rc = cl["r" + R]; if (typeof s !== "number" || !rc) break;
    const ps = s + COUNT, claims = [];
    for (const sl of ["v", "a"]) { const o = rc[sl]; if (!o) continue; for (const k of Object.keys(o)) { const c = o[k]; if (validClaim(g, R, sl, c, ps)) claims.push({ sl, t: c.t, ln: c.ln }); } }
    if (!claims.length) break;
    claims.sort((a, b) => a.t - b.t || (a.sl === g.first ? -1 : 1));
    const key = g.id + "r" + R; if (firstSeen[key] === undefined) firstSeen[key] = Date.now();
    const w = claims[0];
    if (Date.now() - firstSeen[key] < SETTLE) { pend = { r: R, w: w.sl, ln: w.ln }; break; }
    wins[w.sl]++; last = { r: R, w: w.sl, ln: w.ln, t: w.t };
    if (wins[w.sl] >= g.target) { done = w.sl; R++; break; }
  }
  return { R, wins, last, done, pend };
}

/* ───── екран ───── */
let curGid = "", shownR = -1, inter = null, card = null, seq = [], marks = new Set(), lastK = 0, startWriting = false, claimedR = -1, botDue = 0, botSent = 0, lastPl = "", overShown = false, myCard = null, oppCard = null;
const ballHtml = (n, cls) => `<div class="ball ${letterOf(n)} ${cls || ""}"><span class="bl">${letterOf(n)}</span><span class="bn">${n}</span></div>`;
const mkey = () => `bingo_m_${curGid}_${shownR}`;

function buildCard() {
  const el = $("card"); el.innerHTML = "";
  for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) {
    const n = myCard[r][c], d = document.createElement("button"); d.className = "cell" + (n ? "" : " free m"); d.dataset.n = n;
    d.innerHTML = `<i class="d"></i><span class="n">${n || "★"}</span>`; el.appendChild(d);
  }
}
function setupRound(g, R) {
  shownR = R; seq = seqFor(g.seed, R); myCard = cardFor(g.seed, R, me); oppCard = cardFor(g.seed, R, other(me)); lastK = 0; claimedR = -1; startWriting = false; botDue = 0; botSent = 0;
  try { marks = new Set(JSON.parse(ls.get(mkey()) || "[]")); } catch (e) { marks = new Set(); }
  buildCard(); $("main").innerHTML = ""; $("hist").innerHTML = ""; $("leftn").textContent = 75; $("ring").style.setProperty("--p", 0); $("res").classList.remove("on");
  paintMarks(); put(`rd/${g.id}/r${R}/${me}`, true); if (BOT) put(`rd/${g.id}/r${R}/${BOT}`, true);
  info(g);
}
const info = g => { $("info").textContent = `раунд ${shownR + 1} · до ${g.target} ${g.target === 1 ? "перемоги" : "перемог"}`; };
function paintMarks() {
  $("card").querySelectorAll(".cell").forEach(c => { const n = +c.dataset.n; c.classList.toggle("m", !n || marks.has(n)); });
}
function drawnSet(k) { return new Set(seq.slice(0, k)); }
function paintPlayers(g, d) {
  const key = JSON.stringify([d.wins, PEOPLE.v.name, PEOPLE.a.name, lastK, shownR, d.pend && d.pend.w]); if (key === lastPl) return; lastPl = key;
  const dr = drawnSet(lastK);
  [["p1", me], ["p2", other(me)]].forEach(([id, s]) => {
    const cd = s === me ? myCard : oppCard; if (!cd) return;
    const need = needAt(cd, dr), el = $(id);
    const mini = [].concat(...cd).map(n => `<i class="${!n || dr.has(n) ? "on" : ""}"></i>`).join("");
    el.classList.toggle("hot", need <= 1 && lastK > 0);
    el.innerHTML = `<span class="av">${esc(PEOPLE[s].emoji)}</span><span class="tx"><div class="nm">${esc(PEOPLE[s].name)}${s === me ? " · ти" : ""}</div><div class="st">${lastK ? (need === 0 ? "бінго!" : `до бінго: ${need}`) : "…"}</div></span>${s === me ? "" : `<span class="mini">${mini}</span>`}<span class="sc">${d.wins[s]}</span>`;
  });
}
function pushBall(n, animate) {
  const m = $("main"); const old = m.firstElementChild;
  if (old) { const h = document.createElement("div"); h.innerHTML = ballHtml(+old.querySelector(".bn").textContent); const hb = h.firstElementChild; $("hist").prepend(hb); [...$("hist").children].forEach((x, i) => x.style.setProperty("--o", Math.max(.25, 1 - i * .11))); while ($("hist").children.length > 9) $("hist").lastElementChild.remove(); }
  m.innerHTML = ballHtml(n, animate ? "main" : "");
}
function autoOn(g) { return !!g.auto; }
function hints(k) {
  const dr = drawnSet(k);
  $("card").querySelectorAll(".cell").forEach(c => { const n = +c.dataset.n; c.classList.toggle("hint", !!n && dr.has(n) && !marks.has(n) && !autoOn(game())); });
}

function cover(html) { const c = $("cover"); if (c.dataset.h !== html) { c.dataset.h = html; c.innerHTML = html; } c.classList.add("on"); }
function uncover() { $("cover").classList.remove("on"); $("cover").dataset.h = ""; }
function confetti() { const em = ["🎉", "✨", "🎱", "⭐", "💜"]; for (let i = 0; i < 28; i++) { const s = document.createElement("span"); s.className = "cf"; s.textContent = em[i % 5]; s.style.left = Math.random() * 100 + "vw"; s.style.animationDuration = (2.4 + Math.random() * 2.2) + "s"; s.style.animationDelay = Math.random() * .8 + "s"; $("fly").appendChild(s); setTimeout(() => s.remove(), 6000); } }

function showResult(g, d) {
  const w = d.last.w, mine = w === me, card2 = cardFor(g.seed, d.last.r, me), ps = (db.st[g.id]["r" + d.last.r]) + COUNT;
  const dr = new Set(seqFor(g.seed, d.last.r).slice(0, nAt(d.last.t + 300, ps, g.int))), need = needAt(card2, dr);
  $("res").innerHTML = `<div class="bg">БІНГО!</div><div class="big">${esc(PEOPLE[w].emoji)}</div><h2>${mine ? "Ти був(ла) першим(ою)! 🎉" : `${esc(PEOPLE[w].name)} крикнув(ла) першим(ою)`}</h2><p>${mine ? "+1 в рахунок" : need === 0 ? "ти теж мав(ла) бінго, але трохи пізніше" : `тобі лишилось чисел до бінго: ${need}`}</p>`;
  $("res").classList.add("on");
  document.querySelectorAll("#card .cell").forEach(c => c.classList.remove("win"));
  if (mine) { LINES[d.last.ln].forEach(([r, c]) => $("card").children[r * 5 + c].classList.add("win")); sfx.win(); vib([30, 50, 30, 50, 90]); confetti(); } else { sfx.lose(); vib(60); }
}
function showEnd(g, d) {
  const e = $("end"); if (e.dataset.k === g.id) return; e.dataset.k = g.id; const w = d.done;
  e.innerHTML = `<div class="big">🏆</div><h2>перемагає ${esc(PEOPLE[w].emoji)} ${esc(PEOPLE[w].name)}</h2><p>серія до ${g.target} ${g.target === 1 ? "перемоги" : "перемог"}</p>` +
    [me, other(me)].map(s => `<div class="rw${s === w ? " win" : ""}"><span>${esc(PEOPLE[s].emoji)} ${esc(PEOPLE[s].name)}</span><b>${d.wins[s]}</b></div>`).join("") +
    `<button class="go2" data-a="again">ще раз</button><button class="gh2" data-a="menu">в меню</button>`;
  e.classList.add("on"); sfx.win(); vib([30, 50, 30, 50, 90]); confetti();
  logStat(g.id, { g: "bingo", w, s: { v: d.wins.v, a: d.wins.a }, tg: g.target });
}

function tick() {
  const g = game();
  if (!g) { cover(`<div class="big">🎱</div><h2>Готуємо кульки…</h2><p>чекаємо, поки гру запустить другий гравець</p>`); return; }
  if (curGid !== g.id) { curGid = g.id; shownR = -1; inter = null; overShown = false; $("end").classList.remove("on"); $("end").dataset.k = ""; $("res").classList.remove("on"); lastPl = ""; }
  const d = derive(g);
  if (d.done && shownR >= 0 && d.R > shownR && !inter && !overShown) { inter = { until: Date.now() + 2400, fin: true }; showResult(g, d); }
  if (inter) { if (Date.now() < inter.until) return; if (inter.fin) { inter = null; overShown = true; $("res").classList.remove("on"); showEnd(g, d); return; } inter = null; $("res").classList.remove("on"); shownR = -1; }
  if (d.done && shownR < 0) { if (!overShown) { overShown = true; showEnd(g, d); } return; }
  if (shownR >= 0 && d.R > shownR) { inter = { until: Date.now() + 2400 }; showResult(g, d); return; }
  if (shownR < 0) { setupRound(g, d.R); }
  if (!calibrated) { cover(`<div class="big">⏱️</div><h2>Синхронізуємо годинник…</h2>`); return; }
  const st = (db.st && db.st[g.id]) || {}, rd = (db.rd && db.rd[g.id] && db.rd[g.id]["r" + shownR]) || {}, o = PEOPLE[other(me)];
  if (!(rd.v && rd.a)) { cover(`<div class="big">${esc(o.emoji)}</div><h2>Чекаємо ${esc(o.name)}…</h2><p>кульки почнуть падати, щойно обоє будуть готові</p>`); return; }
  const s = st["r" + shownR];
  if (typeof s !== "number") { if (g.first === me && !startWriting) { startWriting = true; put(`st/${g.id}/r${shownR}`, { ".sv": "timestamp" }, false); } cover(`<div class="big">🎱</div><h2>Перемішуємо кульки…</h2>`); return; }
  const ps = s + COUNT, now = srv();
  if (now < ps) { const n = Math.ceil((ps - now) / 1000); cover(`<h2>Раунд ${shownR + 1}</h2><p>на твоїй картці ${g.auto ? "числа позначаються самі" : "позначай числа, що випали, торкаючись їх"}. Першим збери лінію й крикни БІНГО!</p><b class="cnt">${n}</b>`); if (n !== tick.lastN) { tick.lastN = n; sfx.cnt(); } return; }
  uncover();
  const k = nAt(now, ps, g.int);
  if (k > lastK) { for (let i = lastK; i < k; i++) pushBall(seq[i], i === k - 1); if (k - lastK === 1) { sfx.ball(); vib(8); } lastK = k; if (g.auto) { const dr = drawnSet(k); myCard.forEach(r => r.forEach(n => { if (n && dr.has(n)) marks.add(n); })); paintMarks(); } hints(k); $("leftn").textContent = 75 - k; }
  $("ring").style.setProperty("--p", k >= 75 ? 100 : ((now - ps) % g.int) / g.int * 100);
  paintPlayers(g, d);
  const ln = lineDone(myCard, marks), can = ln >= 0 && claimedR !== shownR && !d.pend && !inter;
  $("bingo").disabled = !can; $("bingo").classList.toggle("go", can);
  if (d.pend && claimedR !== shownR && d.pend.w !== me) $("bingo").textContent = "БІНГО!";
  // бот
  if (BOT && !d.pend) botWatch(g, ps, now);
}
setInterval(tick, 100);

/* ───── бот: «бачить» свою картку й кричить бінго з людською затримкою ───── */
function botWatch(g, ps, now) {
  if (!botDue) {
    const bc = cardFor(g.seed, shownR, BOT), pos = new Map(seq.map((n, i) => [n, i])); let best = 99, bl = 0;
    for (let ln = 0; ln < 12; ln++) { const idx = Math.max(...lineNums(bc, ln).map(x => pos.get(x))); if (idx < best) { best = idx; bl = ln; } }
    const dl = BLVL === 1 ? [3200, 6500] : BLVL === 2 ? [1500, 3600] : [500, 1500];
    botDue = ps + best * g.int + dl[0] + Math.random() * (dl[1] - dl[0]); botDue = Math.max(botDue, ps + 800); tick.botLn = bl;
  }
  if (now < botDue || (botSent && Date.now() - botSent < 2500)) return;
  const cl = (db.cl && db.cl[g.id] && db.cl[g.id]["r" + shownR] && db.cl[g.id]["r" + shownR][BOT]) || {};
  if (Object.keys(cl).length) return;
  botSent = Date.now();
  fetch(`${fb}/cl/${g.id}/r${shownR}/${BOT}/c0.json`, { method: "PUT", body: JSON.stringify({ t: { ".sv": "timestamp" }, ln: tick.botLn }) }).catch(() => { botSent = 0; });
  const key = g.id + "r" + shownR; if (firstSeen[key] === undefined) firstSeen[key] = Date.now();
}

/* ───── дії гравця ───── */
$("card").addEventListener("pointerdown", e => {
  const c = e.target.closest(".cell"), g = game(); if (!c || !g || inter || shownR < 0) return;
  const n = +c.dataset.n; if (!n || g.auto) return;
  if (marks.has(n)) { marks.delete(n); } else if (drawnSet(lastK).has(n)) { marks.add(n); sfx.mark(); vib(8); }
  else { c.classList.remove("no"); void c.offsetWidth; c.classList.add("no"); sfx.no(); vib([20, 30, 20]); return; }
  ls.set(mkey(), JSON.stringify([...marks])); paintMarks(); hints(lastK); tick();
});
$("bingo").addEventListener("click", () => {
  const g = game(); if (!g || inter) return; const ln = lineDone(myCard, marks); if (ln < 0 || claimedR === shownR) return;
  claimedR = shownR; $("bingo").disabled = true; $("bingo").classList.remove("go"); vib([40, 40, 60]);
  const key = g.id + "r" + shownR; if (firstSeen[key] === undefined) firstSeen[key] = Date.now();
  const mine = (db.cl && db.cl[g.id] && db.cl[g.id]["r" + shownR] && db.cl[g.id]["r" + shownR][me]) || {};
  fetch(`${fb}/cl/${g.id}/r${shownR}/${me}/c${Object.keys(mine).length}.json`, { method: "PUT", body: JSON.stringify({ t: { ".sv": "timestamp" }, ln }), keepalive: true }).catch(() => { claimedR = -1; });
});
$("end").addEventListener("click", e => { const a = e.target.closest("button")?.dataset.a, g = game(); if (a === "menu") location.href = "index.html"; else if (a === "again" && g) newGame(); });
$("back").addEventListener("click", () => { location.href = "index.html"; });

calibrate();
connect();
if (L && L.by === me) ensureGame();
</script>
