<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<script>(function(){try{var t=localStorage.getItem("dm_theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}})()</script>
<link rel="apple-touch-icon" href="IMG_2010.jpeg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>">
<title>draw &amp; more</title>
<style>
:root{--bg:#fff;--fg:#1b1b1a;--muted:#8d8c88;--line:#e7e7e4;--pill:#fff;--soft:#f4f4f1;--inv-bg:#111;--inv-fg:#fff;--ok:#0f7b6c;--bad:#e03e3e;--sh:rgba(30,30,20,.08);--okbg:#e3f4ef;--serif:"Iowan Old Style","Palatino Linotype",Georgia,serif}
:root[data-theme="dark"]{--bg:#161616;--fg:#ebebea;--muted:#8a8a87;--line:#2e2e2e;--pill:#202020;--soft:#272727;--inv-bg:#ebebea;--inv-fg:#161616;--sh:rgba(0,0,0,.45);--okbg:#12332d}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--fg:#ebebea;--muted:#8a8a87;--line:#2e2e2e;--pill:#202020;--soft:#272727;--inv-bg:#ebebea;--inv-fg:#161616;--sh:rgba(0,0,0,.45);--okbg:#12332d}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{height:100dvh;position:relative;color:var(--fg);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input{font:inherit;color:inherit}
.s{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 18px) 22px calc(env(safe-area-inset-bottom,0px) + 22px);overflow-y:auto;overscroll-behavior:contain}
.s.on{display:flex}
.s>*{width:100%;max-width:400px;position:relative;z-index:1}
.blk{background:var(--inv-bg);color:var(--inv-fg);border-radius:999px;padding:16px 28px;font-size:16px;font-weight:500;text-align:center;transition:transform .15s,opacity .2s}
.blk:active{transform:scale(.97)}
.blk:disabled{opacity:.3;cursor:default}
.blk.sm{padding:12px 18px;font-size:15px}
.wht{background:var(--pill);border:1px solid var(--line);border-radius:999px;padding:16px 28px;font-size:16px;font-weight:500;text-align:center}
.wht:active{transform:scale(.97)}
.lnk{color:var(--muted);font-size:14px;padding:8px}
.muted{color:var(--muted);font-size:14px}
h2{font-family:var(--serif);font-size:28px;font-weight:600;text-align:center}
.err{min-height:20px;color:var(--bad);font-size:14px;text-align:center}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ── привітальний екран ── */
#s-welcome{justify-content:center;align-items:center;overflow:hidden;gap:14px;padding-top:calc(env(safe-area-inset-top,0px) + 24px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
#float,.aura{position:absolute;inset:0;overflow:hidden;pointer-events:none;max-width:none!important;width:auto!important;z-index:0!important}
.aura i{position:absolute;width:64vmax;height:64vmax;border-radius:50%;filter:blur(58px);opacity:.6;animation:drift 16s ease-in-out infinite alternate}
.aura i:nth-child(1){background:radial-gradient(circle,var(--a1,#ffbcd0),transparent 66%);left:-26vmax;top:-22vmax}
.aura i:nth-child(2){background:radial-gradient(circle,var(--a2,#b8d2ff),transparent 66%);right:-30vmax;top:16%;animation-delay:-6s}
.aura i:nth-child(3){background:radial-gradient(circle,var(--a3,#ffe4a0),transparent 66%);left:-12vmax;bottom:-32vmax;animation-delay:-11s}
:root[data-theme="dark"] .aura i{opacity:.3}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .aura i{opacity:.3}}
@keyframes drift{to{transform:translate(9vmax,-7vmax) scale(1.18)}}
#float span{position:absolute;left:0;top:0;opacity:.34;pointer-events:none;will-change:transform;line-height:1;filter:blur(1.5px) drop-shadow(0 6px 8px rgba(0,0,0,.10))}
#float span.fx{opacity:.75;filter:blur(.4px)}
.hero{width:min(100%,400px);margin:0 auto 2px;padding:28px 22px 22px;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;text-align:center;border:1px solid color-mix(in srgb,var(--fg) 9%,transparent);border-radius:28px;background:color-mix(in srgb,var(--bg) 58%,transparent);-webkit-backdrop-filter:blur(18px) saturate(145%);backdrop-filter:blur(18px) saturate(145%);box-shadow:0 12px 38px rgba(30,30,20,.06),inset 0 1px 0 rgba(255,255,255,.38)}
.logo{font-size:58px;line-height:1;animation:wob 3.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg) translateY(-4px)}}
.brand{font-family:var(--serif);font-size:46px;font-weight:700;letter-spacing:.5px;line-height:1.05;background:linear-gradient(90deg,var(--fg) 0%,var(--b1,#e0507a) 30%,var(--b2,#4a7de0) 60%,var(--fg) 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 7s linear infinite}
@keyframes shine{to{background-position:-300% 0}}
.scribble{width:190px;height:16px;overflow:visible}
.scribble path{fill:none;stroke:var(--b1,#e0507a);stroke-width:4;stroke-linecap:round;stroke-dasharray:240;stroke-dashoffset:240;animation:drw 1.4s .5s ease-out forwards}
@keyframes drw{to{stroke-dashoffset:0}}
#tag{min-height:22px;height:auto;max-width:100%;font-size:15px;line-height:1.45;font-weight:550;letter-spacing:.1px;color:var(--fg);text-wrap:balance;transition:opacity .4s}
.cta{min-width:min(250px,100%);margin:2px 0 0;padding:15px 30px;animation:pulse 2.6s ease-out infinite}
.cta-secondary {
  min-width: min(250px, 100%);
  margin-top: -6px;
  padding: 14px 28px;
}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--b1,#e0507a) 45%,transparent)}70%,100%{box-shadow:0 0 0 18px color-mix(in srgb,var(--b1,#e0507a) 0%,transparent)}}
.brand.f-sans{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-weight:800}
.brand.f-round{font-family:ui-rounded,"SF Pro Rounded","Trebuchet MS",sans-serif;font-weight:800}
.brand.f-mono{font-family:ui-monospace,"SF Mono","Courier New",monospace;font-size:38px}
.brand.f-hand{font-family:"Bradley Hand","Segoe Script","Comic Sans MS",cursive;font-size:52px}
.brand.plain{background:none;-webkit-text-fill-color:var(--fg);color:var(--fg);animation:none}
#pvClose{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:20;display:none;padding:10px 18px;border-radius:999px;background:var(--inv-bg);color:var(--inv-fg);font-size:14px;font-weight:600;box-shadow:0 8px 24px var(--sh)}
body.preview #pvClose{display:block}
#s-splash {
  justify-content: center;
  align-items: center;
  gap: 14px;
}

#s-splash .logo {
  margin: 0 0 12px;
  text-align: center;
  flex: none;
}

#s-splash .skel {
  width: 100%;
  height: 76px;
  flex: none;
  border-radius: 22px;
}
.foot{margin-top:12px;text-align:center;font-size:12px;color:var(--muted)}

/* ── код та імʼя ── */
#s-code,#s-name{gap:16px}
.back{align-self:flex-start;font-size:28px;color:var(--muted);width:auto;padding:0 8px;line-height:1}
#cells{display:flex;gap:12px;justify-content:center;margin-top:8px}
#cells i{width:58px;height:68px;border:1.5px solid var(--line);border-radius:16px;display:grid;place-items:center;font:600 30px var(--serif);font-style:normal;transition:border-color .2s;background:var(--pill)}
#cells i.f{border-color:var(--fg)}
#cells.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:auto}
#pad button{height:54px;border:1px solid var(--line);border-radius:16px;font-size:22px;font-weight:500;background:var(--pill)}
#pad button:active{background:var(--soft)}
.hint{text-align:center;color:var(--muted);font-size:13px}
#nm{border:1.5px solid var(--line);border-radius:16px;padding:16px;font-size:18px;text-align:center;outline:none;user-select:text;-webkit-user-select:text;background:var(--pill)}
#nm:focus{border-color:var(--fg)}

/* ── вхід гостя ── */
.me{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600}
.me b{font-size:26px;font-weight:400}
.mid{margin:auto 0;display:flex;flex-direction:column;gap:12px}

/* ── меню ── */
#s-menu{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 104px)}
.pane{display:none;flex-direction:column;gap:12px}
.pane.on{display:flex;animation:fi .35s both}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 4px}
.hello{font:600 27px var(--serif);line-height:1.1}
.st{font-size:13px;color:var(--muted);margin-top:5px}
.av{width:46px;height:46px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:26px;border:1px solid var(--line);flex:none}
.av.big{width:58px;height:58px;font-size:32px}
.pt{font:600 27px var(--serif);margin:6px 0 2px}
.sec{font-size:12px;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);margin:12px 4px 0}
.gc{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:var(--r1,22px);background:var(--pill);border:1px solid var(--line);text-align:left;box-shadow:0 4px 14px var(--sh);transition:transform .15s}
.gc:active{transform:scale(.98)}
.gt{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;font-size:29px;background:rgba(var(--c),.17);flex:none}
.gx{flex:1;min-width:0}
.gx b{display:block;font-size:16px}
.gx small{font-size:13px;color:var(--muted)}
.gc .ch{color:var(--muted);font-size:24px;padding-right:4px}


/* Toast-повідомлення */
#toast {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 20px);
  right: 20px;
  left: auto;
  bottom: auto;
  transform: translateY(-12px);
  z-index: 99999;
  width: max-content;
  max-width: calc(100vw - 40px);
  padding: 12px 18px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--pill);
  color: var(--fg);
  box-shadow: 0 10px 32px var(--sh);
  font-size: 14px;
  text-align: center;
  opacity: 0;
  visibility: hidden;
  transition: opacity .22s, transform .22s, visibility .22s;
  pointer-events: none;
}

#toast.on {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

#toast.bad {
  border-color: color-mix(in srgb, var(--bad) 45%, var(--line));
}


#noteNotice {
  position: fixed;
  left: 50%;
  top: calc(env(safe-area-inset-top, 0px) + 18px);
  transform: translate(-50%, -14px);
  z-index: 50;
  width: min(360px, calc(100vw - 32px));
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--pill);
  color: var(--fg);
  box-shadow: 0 12px 36px var(--sh);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .22s, transform .22s, visibility .22s;
}

#noteNotice.on {
  opacity: 1;
  visibility: visible;
  transform: translate(-50%, 0);
}

#noteNotice .nn-head {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 7px;
}

#noteNotice .nn-emoji {
  font-size: 25px;
  line-height: 1;
}

#noteNotice .nn-name {
  font-size: 14px;
  font-weight: 700;
}

#noteNotice .nn-text {
  font-size: 14px;
  line-height: 1.4;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

@media (prefers-reduced-motion: reduce) {
  #noteNotice { transition: none; }
}

/* Власне підтвердження замість системного confirm */
#confirmLayer{
  position:fixed;inset:0;z-index:35;
  display:none;align-items:center;justify-content:center;
  padding:24px;background:rgba(0,0,0,.38)
}
#confirmLayer.on{display:flex}
#confirmBox{
  width:100%;max-width:340px;padding:22px;
  border:1px solid var(--line);border-radius:24px;
  background:var(--bg);box-shadow:0 18px 60px rgba(0,0,0,.2);
  display:flex;flex-direction:column;gap:16px;text-align:center
}
#confirmBox p{font:600 20px var(--serif);line-height:1.35}
#confirmBox .actions{display:flex;gap:8px}
#confirmBox .actions>*{flex:1;padding:12px 14px;font-size:14px}

/* Ніжний градієнт заголовків */
.hello,.pt,#hgQ{
  background:linear-gradient(105deg,var(--fg) 0%,#d47b9b 28%,#8b83d8 52%,#63a9bd 72%,var(--fg) 100%);
  background-size:240% 100%;
  background-position:100% 50%;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:heading-flow 11s ease-in-out infinite alternate
}
@keyframes heading-flow{to{background-position:0% 50%}}

/* Скелетон */
.skel {
  position: relative;
  overflow: hidden;
  height: 76px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: linear-gradient(
    100deg,
    var(--pill) 25%,
    var(--soft) 45%,
    var(--pill) 65%
  );
  background-size: 220% 100%;
  animation: sk-shimmer 1.5s ease-in-out infinite;
}

.skel::before,
.skel::after {
  content: "";
  position: absolute;
  left: 18px;
  height: 9px;
  border-radius: 10px;
  background: var(--line);
  opacity: .7;
}

.skel::before {
  top: 22px;
  width: 42%;
}

.skel::after {
  top: 40px;
  width: 65%;
  opacity: .4;
}

.skel:nth-of-type(3) {
  opacity: .75;
}

.skel:nth-of-type(4) {
  opacity: .5;
}

@keyframes sk-shimmer {
  to {
    background-position-x: -220%;
  }
}

/* Переливання навколо емодзі в головному меню */
#mAv {
  position: relative;
  isolation: isolate;
  border: 0;
  background: transparent;
}

#mAv::before {
  content: "";
  position: absolute;
  inset: -1px;
  border-radius: 50%;
  background: conic-gradient(
    from 0deg,
    #ff6b9d,
    #a78bfa,
    #60a5fa,
    #5eead4,
    #fde68a,
    #ff6b9d
  );
  z-index: -2;
  animation: avatarSpin 4s linear infinite;
  filter: drop-shadow(0 0 4px rgba(167, 139, 250, .4));
}

#mAv::after {
  content: "";
  position: absolute;
  inset: 2px;
  border-radius: 50%;
  background: var(--soft);
  z-index: -1;
}

@keyframes avatarSpin {
  to {
    transform: rotate(360deg);
  }
}

@media (prefers-reduced-motion: reduce) {
  #mAv::before {
    animation: none;
  }
}



/* ===== COMPACT LIQUID GLASS DOCK ===== */

#dock {
  display: none;
  position: fixed;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  transform: translateX(-50%);

  width: min(280px, calc(100vw - 48px));
  box-sizing: border-box;

  align-items: center;
  justify-content: space-between;
  gap: 4px;

  padding: 5px;

  background: rgba(255, 255, 255, 0.78);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);

  border: 1px solid rgba(0, 0, 0, 0.12);
  border-radius: 999px;

  box-shadow:
    0 8px 25px rgba(0, 0, 0, 0.08),
    inset 0 1px 1px rgba(255, 255, 255, 0.9);

  z-index: 6;
}

body.menu-on #dock {
  display: flex;
}

/* Кнопки */
.dk {
  position: relative;

  display: flex;
  flex: 1 1 0;
  min-width: 0;
  height: 52px;

  align-items: center;
  justify-content: center;

  padding: 0;
  border: 1px solid transparent;
  border-radius: 999px;

  background: transparent;
  color: #383838;

  cursor: pointer;

  transition:
    background .25s ease,
    transform .2s ease;
}

/* Приховуємо SVG та текст */
.dk svg,
.dk span {
  display: none !important;
}

/* Емодзі */
.dk::before {
  display: block;
  font-size: 25px;
  line-height: 1;
}

.dk[data-tab="games"]::before {
  content: "🎮";
}

.dk[data-tab="stats"]::before {
  content: "🏆";
}

.dk[data-tab="set"]::before {
  content: "⚙️";
}

.dk[data-tab="studio"]::before {
  content: "🚧";
}

/* Активний пункт */
.dk.on {
  background: rgba(0, 0, 0, 0.075);
  color: #000;
}

/* Натискання */
.dk:active {
  transform: scale(0.90);
}

/* Прихована студія */
.dk[hidden] {
  display: none !important;
}

/* Темна тема */
@media (prefers-color-scheme: dark) {
  #dock {
    background: rgba(35, 35, 38, 0.78);
    border-color: rgba(255, 255, 255, 0.16);

    box-shadow:
      0 8px 25px rgba(0, 0, 0, 0.25),
      inset 0 1px 1px rgba(255, 255, 255, 0.12);
  }

  .dk {
    color: #dedede;
  }

  .dk.on {
    background: rgba(255, 255, 255, 0.14);
    color: #fff;
  }
}


/* картка гри (шторка) */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.38);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .3s,visibility 0s .3s;z-index:8}
#sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:480px;transform:translate(-50%,100%);visibility:hidden;transition:transform .42s cubic-bezier(.2,.8,.2,1),visibility 0s .42s;background:var(--bg);border-radius:calc(var(--r1,22px) + 6px) calc(var(--r1,22px) + 6px) 0 0;padding:10px 22px calc(env(safe-area-inset-bottom,0px) + 22px);z-index:9;display:flex;flex-direction:column;gap:14px;max-height:90dvh;overflow-y:auto;box-shadow:0 -12px 44px rgba(0,0,0,.22)}
.sh-open #scrim{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .3s}
.sh-open #sheet{transform:translate(-50%,0);visibility:visible;transition:transform .42s cubic-bezier(.2,.8,.2,1)}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);align-self:center}
.shh{display:flex;align-items:center;gap:14px}
.shh .gt{width:62px;height:62px;font-size:34px;border-radius:20px}
.shh b{font:600 24px var(--serif)}
#dDesc{font-size:15px;line-height:1.5;color:var(--muted)}
.og{display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap;margin-top:6px}
.ol{font-size:12px;color:var(--muted)}
.chip{padding:8px 16px;border:1px solid var(--line);border-radius:999px;font-size:14px;color:var(--muted)}
.chip.on{border-color:var(--fg);color:var(--fg);font-weight:600}
#dSet{display:flex;flex-direction:column;gap:12px}

/* налаштування */
.card2{background:var(--pill);border:1px solid var(--line);border-radius:var(--r1,22px);overflow:hidden;box-shadow:0 4px 14px var(--sh)}
.ro{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;font-size:15px}
.ro+.ro,.prof+.ro{border-top:1px solid var(--line)}
.ro.col{flex-direction:column;align-items:stretch}
.ro .lnk{padding:4px 0}
.prof{display:flex;align-items:center;gap:14px;padding:16px}
.prof b{display:block;font-size:18px}
.prof small{font-size:13px;color:var(--muted)}
.ems{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:2px 12px 12px;justify-items:center}
#nmEdit{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;font-size:15px;outline:none;background:var(--bg);user-select:text;-webkit-user-select:text}
#nmEdit:focus{border-color:var(--fg)}
.ems button{font-size:24px;padding:6px 8px;border-radius:12px}
.ems button.on{background:var(--soft);box-shadow:inset 0 0 0 1.5px var(--fg)}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:3px}
.seg button{flex:1;padding:9px 0;border-radius:999px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--pill);color:var(--fg);font-weight:600;box-shadow:0 1px 5px var(--sh)}

let toastTimer = 0, confirmResolve = null, noteTimer = 0;

function showNoteNotice(note) {
  const el = $("noteNotice");
  if (!el) return;

  el.querySelector(".nn-emoji").textContent = note.emoji || "💌";

  noteTimer = setTimeout(() => {
    el.classList.remove("on");
  }, 3000);
}

function toast(message, type = "ok") {
  const el = $("toast");
  if (!el) return;
  clearTimeout(toastTimer);
  el.textContent = message;
  el.classList.toggle("bad", type === "bad");
  el.classList.add("on");
  toastTimer = setTimeout(() => el.classList.remove("on"), 2600);

  return new Promise(resolve => {

    $("confirmLayer").classList.add("on");
    $("confirmYes").focus();
  });

function closeConfirm(value) {
  if (!confirmResolve) return;
  const done = confirmResolve;
  confirmResolve = null;
  $("confirmLayer").classList.remove("on");
  done(value);
}

const ABC = "АБВГҐДЕЄЖЗИІЇЙКЛМНОПРСТУФХЦЧШЩЬЮЯ";
let gKey = "", gmode = false, draft = [], ovKey = "";
function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newHang(c) {  // c.bot — слот бота (якщо гра з ботом)
  // питання, що вже були у вашій кімнаті, не повторюємо, доки не закінчаться всі
  const used = db.usedQs || {};
  let pool = QS.map((_, i) => i).filter(i => !used["q" + i]), fresh = false;
  if (pool.length < c.n) { pool = QS.map((_, i) => i); fresh = true; }
  const idx = shuffle(pool).slice(0, c.n), nu = fresh ? {} : { ...used };
  idx.forEach(i => { nu["q" + i] = 1; });
  put("usedQs", nu);
  return { id: rnd(), qs: idx, n: c.n, lives: c.lives, r: 0, tried: "", turn: "a", score: { v: 0, a: 0 }, bot: c.bot || null, botLvl: c.botLvl || 2 };
}
const cloneG = () => { const g = JSON.parse(JSON.stringify(db.game)); g.tried = g.tried || ""; g.score = g.score || {}; g.score.v = g.score.v || 0; g.score.a = g.score.a || 0; return g; };
const wordOf = g => QS[g.qs[g.r]][1];
function hangMove(ch, who = mySlot) {
  const g = cloneG(), w = wordOf(g);
  if (g.res || g.turn !== who || g.tried.includes(ch)) return;
  g.tried += ch;
  const hits = [...w].filter(c => c === ch).length;
  g.last = { by: who, t: "l", v: ch, ok: hits > 0 };
  if (hits) {
    g.score[who] += hits;
    if ([...w].every(c => g.tried.includes(c))) { g.score[who] += 2; g.res = { w: who }; }
  } else if ([...g.tried].filter(c => !w.includes(c)).length >= g.lives) g.res = { w: "" };
  if (!g.res) g.turn = otherOf(g.turn);
  if (who === mySlot) vib(hits ? 15 : [20, 30, 20]); put("game", g);
}
function hangWord() {
  const g = cloneG(), w = wordOf(g);
  const bl = [...w].filter(c => !g.tried.includes(c));
  if (g.res || g.turn !== mySlot || draft.length < bl.length) return;
  let i = 0; const s = [...w].map(c => g.tried.includes(c) ? c : draft[i++]).join("");
  if (s === w) { g.score[mySlot] += bl.length + 2; g.res = { w: mySlot }; g.last = null; }
  else { g.score[mySlot] = Math.max(0, g.score[mySlot] - 1); g.last = { by: mySlot, t: "w", v: s }; g.turn = otherOf(g.turn); }
  gmode = false; draft = []; put("game", g);
}
function nextRound() {
  const g = cloneG(), nr = g.r + 1;
  if (nr >= g.n) { g.done = true; put("game", g); return; }
  g.r = nr; g.tried = ""; g.turn = "a"; delete g.res; delete g.last; put("game", g);
}
function renderHang() {
  const g = db.game;
  if (!g || !g.qs) { $("hgQ").textContent = "чекаємо початок гри…"; $("hgBox").textContent = $("hgKb").textContent = $("hgAct").textContent = $("hgPl").textContent = $("hgSt").textContent = ""; return; }
  const T = g.tried || "", w = wordOf(g), res = g.res, sc = g.score || {};
  const key = g.id + ":" + g.r; if (key !== gKey) { gKey = key; gmode = false; draft = []; }
  if (g.turn !== mySlot || res) { gmode = false; draft = []; }
  const wrong = [...T].filter(c => !w.includes(c)).length, left = Math.max(0, g.lives - wrong);
  $("hgInfo").textContent = `${g.r + 1}/${g.n} · ${"❤️".repeat(left)}${"🖤".repeat(g.lives - left)}`;
  $("hgPl").innerHTML = ["a", "v"].map(s => `<div class="pc${g.turn === s && !res ? " turn" : ""}"><span>${esc(pl(s).emoji)} ${esc(pl(s).name)}</span><b>${sc[s] || 0}</b></div>`).join("");
  $("hgQ").textContent = QS[g.qs[g.r]][0];
  const bl = [...w].filter(c => !T.includes(c));
  let di = 0;
  $("hgBox").innerHTML = [...w].map(c => T.includes(c) ? `<i class="o">${c}</i>` : res ? `<i class="m">${c}</i>` : gmode ? `<i class="d">${draft[di++] || ""}</i>` : "<i></i>").join("");
  const L = g.last; let st = "";
  if (L) st = L.t === "l" ? `${esc(pl(L.by).emoji)} літера «${L.v}» — ${L.ok ? "є ✅" : "нема ❌"}` : `${esc(pl(L.by).emoji)} слово «${esc(L.v)}» — не те ❌ (−1)`;
  if (!res) st += `<br><b>${g.turn === mySlot ? "твоя черга" : `ходить ${esc(pl(g.turn).emoji)} ${esc(pl(g.turn).name)}`}</b>`;
  $("hgSt").innerHTML = st;
  $("hgKb").innerHTML = [...ABC].map(c => {
    const t = T.includes(c), good = t && w.includes(c);
    const dis = t || res || g.turn !== mySlot || (gmode && draft.length >= bl.length);
    return `<button class="k${good ? " ok" : t ? " bad" : ""}" data-k="${c}"${dis ? " disabled" : ""}>${c}</button>`;
  }).join("");
  const my = g.turn === mySlot && !res;
  $("hgAct").innerHTML = !my ? "" : gmode
    ? `<button class="wht" data-a="back">⌫</button><button class="wht" data-a="cancel">скасувати</button><button class="blk sm" data-a="ok"${draft.length < bl.length ? " disabled" : ""}>підтвердити</button>`
    : `<button class="wht" data-a="word">вгадати слово</button>`;
  const ok = key + ":" + (g.done ? "d" : res ? "r" : ""), ov = $("hgOv");
  if (ok !== ovKey) {
    ovKey = ok;
    if (g.done) {
      const a = sc.a || 0, v = sc.v || 0, win = a === v ? "" : a > v ? "a" : "v";
      if (!g.bot) put("stats/log/" + g.id, { g: "word", w: win, s: { v, a }, t: Date.now() });
      ov.innerHTML = `<div class="big">${win ? "🏆" : "🤝"}</div><h2>${win ? `перемагає ${esc(pl(win).emoji)} ${esc(pl(win).name)}` : "нічия"}</h2>` +
        ["a", "v"].map(s => `<div class="row${s === win ? " win" : ""}"><span>${esc(pl(s).emoji)} ${esc(pl(s).name)}</span><b>${sc[s] || 0}</b></div>`).join("") +
        `<button class="blk" data-a="again">ще раз</button><button class="wht" data-a="menu">в меню</button>`;
      ov.classList.add("on"); vib([30, 50, 30, 50, 90]);
    } else if (res) {
      ov.innerHTML = `<div class="big">${res.w ? "🎉" : "💔"}</div><h2>${res.w ? `${esc(pl(res.w).emoji)} ${esc(pl(res.w).name)} відгадує слово!` : "спроби закінчились"}</h2><div class="wd">${w}</div>` +
        `<button class="blk" data-a="next">${g.r + 1 >= g.n ? "підсумок" : "далі"}</button>`;
      ov.classList.add("on"); vib([30, 50, 30]);
    } else ov.classList.remove("on");
  }
  botCheck(g);
}
/* бот для «вгадай слово»: вгадує літери за частотою та списком відповідей, не підглядаючи в слово */
let botT = 0;
const FREQ = "ОАНІЕВИТРСКЛДМПУЯЗЬБГЧХЖШЮЦЩЇЄФҐЙ";
function botPick(g) {
  const w = wordOf(g), T = g.tried || "", lvl = +(g.botLvl || 2), left = [...ABC].filter(c => !T.includes(c));
  const rand = (n = 10) => { const top = [...FREQ].filter(c => left.includes(c)).slice(0, n); return top[Math.floor(Math.random() * top.length)] || left[0]; };
  if (lvl === 1) return rand(14);
  const pat = [...w].map(c => T.includes(c) ? c : null), wrong = [...T].filter(c => !w.includes(c));
  const cand = QS.map(q => q[1]).filter(a => a.length === pat.length && pat.every((p, i) => p === null ? !T.includes(a[i]) : a[i] === p) && !wrong.some(c => a.includes(c)));
  const cnt = {}; cand.forEach(a => new Set([...a].filter((c, i) => pat[i] === null)).forEach(c => { cnt[c] = (cnt[c] || 0) + 1; }));
  const best = Object.entries(cnt).filter(([c]) => left.includes(c)).sort((a, b) => b[1] - a[1]);
  if (!best.length) return rand();
  if (lvl === 2 && Math.random() < .25) return rand();
  return best[0][0];
}
function botCheck(g) {
  if (!g || !g.bot || g.done || g.res || g.turn !== g.bot || g.bot === mySlot || botT) return;
  const key = g.id + ":" + g.r + ":" + (g.tried || "");
  botT = setTimeout(() => {
    botT = 0; const cg = db.game;
    if (!cg || cg.res || cg.done || cg.turn !== cg.bot) return;
    if (cg.id + ":" + cg.r + ":" + (cg.tried || "") !== key) { botCheck(cg); return; }   // стан змінився — плануємо наново
    try { hangMove(botPick(cg), cg.bot); } catch (e) { setTimeout(() => botCheck(db.game), 1200); }
  }, 1100 + Math.random() * 900);
}
// сторож: якщо подію загубили, бот усе одно ходить
setInterval(() => { if (cur() === "s-hang" && db.game) botCheck(db.game); }, 1500);

$("hgAct").onclick = e => {
  const b = e.target.closest("button"); if (!b || b.disabled) return; const a = b.dataset.a;
  if (a === "word") { gmode = true; draft = []; renderHang(); }
  else if (a === "cancel") { gmode = false; draft = []; renderHang(); }
  else if (a === "back") { draft.pop(); renderHang(); }
  else if (a === "ok") hangWord();
};
$("hgOv").onclick = e => {
  const a = e.target.closest("button")?.dataset.a;
  if (a === "next") nextRound();
  else if (a === "again") { const g = db.game; put("game", newHang({ n: g.n, lives: g.lives, bot: g.bot, botLvl: g.botLvl })); }
  else if (a === "menu") { $("hgOv").classList.remove("on"); toMenu(); }
